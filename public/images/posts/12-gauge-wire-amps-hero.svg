<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="tgHeroTitle tgHeroDesc">
  <title id="tgHeroTitle">12 gauge wire amps</title>
  <desc id="tgHeroDesc">Abstract hero graphic with soft gradients showing three candidate ampacity figures for 12 gauge wire — 20, 25 and 30 amps — with the 20 amp figure highlighted as the breaker rating.</desc>

  <defs>
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="tgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tgTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tgAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="tgBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="tgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#tgBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#tgSky)" filter="url(#tgBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#tgTeal)" filter="url(#tgBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">12 gauge wire</tspan>
    <tspan x="80" dy="50" fill="#0284C7">how many amps?</tspan>
  </text>
  <text x="80" y="298" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">All three answers are real</text>
  <rect x="80" y="322" width="56" height="4" rx="2" fill="url(#tgAccentBar)"/>

  <!-- Three candidate figures, the breaker one highlighted -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="540" y="150" width="340" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="3" filter="url(#tgGlow)"/>
    <text x="566" y="192" fill="#0F766E" font-size="30" font-weight="800">20 A</text>
    <text x="664" y="180" fill="#152035" font-size="13" font-weight="700">the breaker</text>
    <text x="664" y="200" fill="#64748B" font-size="11" font-weight="500">240.4(D) small-conductor rule</text>

    <rect x="540" y="230" width="340" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="566" y="267" fill="#2563EB" font-size="24" font-weight="800">25 A</text>
    <text x="664" y="258" fill="#152035" font-size="12" font-weight="600">75 °C ceiling</text>
    <text x="664" y="276" fill="#64748B" font-size="10.5" font-weight="500">termination limit, 110.14(C)</text>

    <rect x="540" y="302" width="340" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="566" y="339" fill="#EA580C" font-size="24" font-weight="800">30 A</text>
    <text x="664" y="330" fill="#152035" font-size="12" font-weight="600">90 °C base</text>
    <text x="664" y="348" fill="#64748B" font-size="10.5" font-weight="500">where derating starts</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
