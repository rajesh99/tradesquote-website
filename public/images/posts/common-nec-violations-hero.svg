<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="cvHeroTitle cvHeroDesc">
  <title id="cvHeroTitle">The NEC violations inspectors flag most</title>
  <desc id="cvHeroDesc">Abstract hero graphic with soft gradients showing that ten repeat items account for most flagged violations and every one is checkable before the inspector arrives.</desc>

  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="cvSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cvTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cvAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cvBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#cvBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#cvSky)" filter="url(#cvBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#cvTeal)" filter="url(#cvBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="156" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">The violations</tspan>
    <tspan x="80" dy="40" fill="#0284C7">inspectors flag most</tspan>
  </text>
  <text x="80" y="266" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Ten items, and none are judgement calls</text>
  <rect x="80" y="290" width="56" height="4" rx="2" fill="url(#cvAccentBar)"/>
  <text x="80" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">every one is checkable before they arrive</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">THE THREE THAT LEAD THE LIST</text>

    <rect x="530" y="134" width="356" height="44" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="161" fill="#B91C1C" font-size="13.5" font-weight="700">box fill — 314.16</text>

    <rect x="530" y="186" width="356" height="44" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="213" fill="#EA580C" font-size="13.5" font-weight="700">bonded subpanel neutral — 250.24(A)(5)</text>

    <rect x="530" y="238" width="356" height="44" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="265" fill="#2563EB" font-size="13.5" font-weight="700">missing AFCI or GFCI — 210.12 / 210.8</text>

    <rect x="530" y="298" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="326" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="800">a 15-minute walkthrough</text>
    <text x="708" y="348" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">saves a re-inspection fee and two trips</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">most are misremembered rules, not carelessness</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
