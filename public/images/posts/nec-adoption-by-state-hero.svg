<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="naHeroTitle naHeroDesc">
  <title id="naHeroTitle">NEC adoption by state</title>
  <desc id="naHeroDesc">Abstract hero graphic with soft gradients showing that the published NEC edition is not the enforced one, because states adopt on their own schedule and amend.</desc>

  <defs>
    <linearGradient id="naBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="naSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="naTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="naAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="naBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#naBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#naSky)" filter="url(#naBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#naTeal)" filter="url(#naBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">NEC adoption</tspan>
    <tspan x="80" dy="40" fill="#0284C7">by state</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Published is not the same as enforced</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#naAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">the AHJ decides — always confirm locally</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">THE MODEL CODE</text>
    <rect x="530" y="134" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="163" fill="#2563EB" font-size="14" font-weight="700">NFPA publishes every three years</text>

    <text x="530" y="210" fill="#94A3B8" font-size="11" font-weight="700">WHAT'S ACTUALLY ENFORCED</text>
    <rect x="530" y="222" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="251" fill="#EA580C" font-size="14" font-weight="700">often a cycle or two behind, amended</text>

    <rect x="530" y="290" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="318" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">three questions, not one</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">which edition · which amendments · which AHJ</text>

    <text x="530" y="386" fill="#94A3B8" font-size="11" font-weight="600">a few states have no statewide code at all</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
