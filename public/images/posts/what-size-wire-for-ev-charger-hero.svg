<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ewHeroTitle ewHeroDesc">
  <title id="ewHeroTitle">What size wire for an EV charger</title>
  <desc id="ewHeroDesc">Abstract hero graphic with soft gradients showing a 48 amp charger becoming a 60 amp circuit on 6 AWG copper with a 10 AWG ground.</desc>

  <defs>
    <linearGradient id="ewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ewSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ewTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ewAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ewBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ewBg)"/>
  <ellipse cx="798" cy="136" rx="200" ry="160" fill="url(#ewSky)" filter="url(#ewBlur)"/>
  <ellipse cx="662" cy="392" rx="180" ry="140" fill="url(#ewTeal)" filter="url(#ewBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="172" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">What size wire</tspan>
    <tspan x="80" dy="42" fill="#0284C7">for an EV charger?</tspan>
  </text>
  <text x="80" y="284" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Continuous by rule — NEC 625.41</text>
  <rect x="80" y="308" width="56" height="4" rx="2" fill="url(#ewAccentBar)"/>

  <!-- 48 A becomes a 60 A circuit -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="530" y="132" width="150" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="605" y="164" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="800">48 A</text>
    <text x="605" y="182" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="600">charger output</text>

    <path d="M690 162 L 726 162" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <rect x="736" y="132" width="150" height="60" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="811" y="164" text-anchor="middle" fill="#EA580C" font-size="22" font-weight="800">60 A</text>
    <text x="811" y="182" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="600">× 1.25, rounded up</text>

    <rect x="530" y="216" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="246" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">6 AWG Cu · 10 AWG EGC</text>
    <text x="708" y="268" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">65 A at 75 °C — but only 55 A in NM cable</text>

    <rect x="530" y="302" width="356" height="34" rx="17" fill="#FEF2F2" fill-opacity="0.9" stroke="#FCA5A5" stroke-width="1.6"/>
    <text x="708" y="324" text-anchor="middle" fill="#DC2626" font-size="12" font-weight="800">6/3 Romex is not enough for 60 A</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
