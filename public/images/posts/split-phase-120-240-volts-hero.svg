<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="sphHeroTitle sphHeroDesc">
  <title id="sphHeroTitle">Split-phase 120/240 volt service explained</title>
  <desc id="sphHeroDesc">Abstract hero graphic showing a centre-tapped transformer secondary giving 120 volts from either leg to neutral and 240 volts across both legs — one phase, not two.</desc>

  <defs>
    <linearGradient id="sphBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="sphSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sphTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sphAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sphBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#sphBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#sphSky)" filter="url(#sphBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#sphTeal)" filter="url(#sphBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Split-phase</tspan>
    <tspan x="80" dy="40" fill="#0284C7">120/240 V</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Two voltages from one winding</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#sphAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">one phase — never two</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">EITHER LEG TO NEUTRAL</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#E8F8F6" stroke="#01AD9F" stroke-width="2"/>
    <text x="550" y="159" fill="#0F766E" font-size="14" font-weight="700">120 V — lighting and receptacles</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">LEG TO LEG</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="249" fill="#C2410C" font-size="14" font-weight="700">240 V — and no neutral needed</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">the neutral carries</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">the difference</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">40 A and 30 A on the legs — 10 A on the neutral</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">lose it and a light leg can climb to 228 V</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
