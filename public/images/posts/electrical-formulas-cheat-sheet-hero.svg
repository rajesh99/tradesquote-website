<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="efHeroTitle efHeroDesc">
  <title id="efHeroTitle">Electrical formulas cheat sheet</title>
  <desc id="efHeroDesc">Abstract hero graphic with soft gradients showing the four Ohm's law quantities and the order in which sizing formulas are applied.</desc>

  <defs>
    <linearGradient id="efBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="efSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="efTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="efAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="efBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#efBg)"/>
  <ellipse cx="800" cy="132" rx="200" ry="160" fill="url(#efSky)" filter="url(#efBlur)"/>
  <ellipse cx="655" cy="392" rx="180" ry="140" fill="url(#efTeal)" filter="url(#efBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="176" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Electrical</tspan>
    <tspan x="80" dy="44" fill="#0284C7">formulas</tspan>
  </text>
  <text x="80" y="286" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Ohm's law to three-phase, in order</text>
  <rect x="80" y="310" width="56" height="4" rx="2" fill="url(#efAccentBar)"/>

  <!-- Four quantities -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="112" width="176" height="76" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="612" y="150" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="800">V = I × R</text>
    <text x="612" y="172" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">volts</text>

    <rect x="716" y="112" width="176" height="76" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="804" y="150" text-anchor="middle" fill="#EA580C" font-size="22" font-weight="800">I = V ÷ R</text>
    <text x="804" y="172" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">amps</text>

    <rect x="524" y="200" width="176" height="76" rx="12" fill="#E8F8F6" stroke="#01AD9F" stroke-width="2"/>
    <text x="612" y="238" text-anchor="middle" fill="#0F766E" font-size="22" font-weight="800">P = V × I</text>
    <text x="612" y="260" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">watts</text>

    <rect x="716" y="200" width="176" height="76" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="804" y="238" text-anchor="middle" fill="#DC2626" font-size="22" font-weight="800">P = I²R</text>
    <text x="804" y="260" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">why loose lugs burn</text>

    <rect x="524" y="300" width="368" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="708" y="326" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="800">K 12.9 · √3 1.732 · ×1.25 · ×0.83</text>
    <text x="708" y="350" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the four constants behind most of the work</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
