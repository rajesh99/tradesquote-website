<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="spHeroTitle spHeroDesc">
  <title id="spHeroTitle">What size wire for a 100 amp sub panel</title>
  <desc id="spHeroDesc">Abstract hero graphic with soft gradients showing a main panel feeding a subpanel over a four-conductor feeder, with the two candidate conductor sizes called out.</desc>

  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="spSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="spTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="spAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="spBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#spBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#spSky)" filter="url(#spBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#spTeal)" filter="url(#spBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="186" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Wire size for a</tspan>
    <tspan x="80" dy="46" fill="#0284C7">100 A sub panel</tspan>
  </text>
  <text x="80" y="288" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Two right answers — pick carefully</text>
  <rect x="80" y="312" width="56" height="4" rx="2" fill="url(#spAccentBar)"/>

  <!-- Main panel -->
  <rect x="524" y="152" width="70" height="130" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#7DD3FC" stroke-width="2"/>
  <text x="559" y="178" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">MAIN</text>
  <rect x="538" y="192" width="42" height="18" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="559" y="205" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">100A</text>

  <!-- Four conductors -->
  <line x1="594" y1="182" x2="826" y2="182" stroke="#152035" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <line x1="594" y1="205" x2="826" y2="205" stroke="#152035" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <line x1="594" y1="228" x2="826" y2="228" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="594" y1="251" x2="826" y2="251" stroke="#16A34A" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Subpanel -->
  <rect x="826" y="152" width="70" height="130" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#5EEAD4" stroke-width="2"/>
  <text x="861" y="178" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">SUB</text>
  <rect x="838" y="192" width="46" height="14" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
  <rect x="838" y="212" width="46" height="14" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
  <text x="861" y="248" text-anchor="middle" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800">not bonded</text>

  <!-- Two candidate sizes -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="318" width="180" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#01AD9F" stroke-width="2"/>
    <text x="540" y="342" fill="#0F766E" font-size="19" font-weight="800">3 AWG Cu</text>
    <text x="540" y="364" fill="#64748B" font-size="10.5" font-weight="500">ordinary subpanel · 310.16</text>

    <rect x="716" y="318" width="180" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#93C5FD" stroke-width="2"/>
    <text x="732" y="342" fill="#2563EB" font-size="19" font-weight="800">4 AWG Cu</text>
    <text x="732" y="364" fill="#64748B" font-size="10.5" font-weight="500">whole-house feeder · 310.12</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
