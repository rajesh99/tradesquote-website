<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="awHeroTitle awHeroDesc">
  <title id="awHeroTitle">Amps to watts</title>
  <desc id="awHeroDesc">Abstract hero graphic with soft gradients showing a current figure multiplied by voltage to give volt-amperes, of which power factor determines the real watts.</desc>

  <defs>
    <linearGradient id="awBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="awSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="awTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="awAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="awBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#awBg)"/>
  <ellipse cx="795" cy="135" rx="200" ry="160" fill="url(#awSky)" filter="url(#awBlur)"/>
  <ellipse cx="665" cy="390" rx="180" ry="140" fill="url(#awTeal)" filter="url(#awBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="184" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Amps</tspan>
    <tspan x="80" dy="44" fill="#0284C7">to watts</tspan>
  </text>
  <text x="80" y="290" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Voltage, power factor, and VA vs W</text>
  <rect x="80" y="314" width="56" height="4" rx="2" fill="url(#awAccentBar)"/>

  <!-- Power triangle, to scale: 1,920 W / 1,440 VAR / 2,400 VA -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <line x1="560" y1="330" x2="800" y2="330" stroke="#01AD9F" stroke-width="5"/>
    <line x1="800" y1="330" x2="800" y2="150" stroke="#EA580C" stroke-width="4"/>
    <line x1="560" y1="330" x2="800" y2="150" stroke="#2563EB" stroke-width="5"/>
    <path d="M560 318 L 572 318 L 572 330" stroke="#94A3B8" stroke-width="0" fill="none"/>
    <path d="M788 330 L 788 318 L 800 318" stroke="#94A3B8" stroke-width="1.4" fill="none"/>

    <text x="680" y="356" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="800">P = 1,920 W</text>
    <text x="680" y="374" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="500">what does work</text>

    <text x="814" y="244" fill="#EA580C" font-size="14" font-weight="800">Q = 1,440</text>
    <text x="814" y="262" fill="#94A3B8" font-size="10" font-weight="500">VAR</text>

    <text x="556" y="132" fill="#2563EB" font-size="15" font-weight="800">S = 2,400 VA</text>
    <text x="556" y="150" fill="#94A3B8" font-size="11" font-weight="500">20 A × 120 V — what the wire carries</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
