<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="caHeroTitle caHeroDesc">
  <title id="caHeroTitle">Copper vs aluminum wire</title>
  <desc id="caHeroDesc">Abstract hero graphic with soft gradients showing that aluminum needs 1.59 times the circular mils of copper for the same ampacity, and reaches 1.64 times less far at the same size.</desc>

  <defs>
    <linearGradient id="caBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="caSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="caTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="caAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="caBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#caBg)"/>
  <ellipse cx="804" cy="134" rx="200" ry="160" fill="url(#caSky)" filter="url(#caBlur)"/>
  <ellipse cx="652" cy="394" rx="180" ry="140" fill="url(#caTeal)" filter="url(#caBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="168" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Copper vs</tspan>
    <tspan x="80" dy="42" fill="#0284C7">aluminum</tspan>
  </text>
  <text x="80" y="280" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Two constants decide every answer</text>
  <rect x="80" y="304" width="56" height="4" rx="2" fill="url(#caAccentBar)"/>
  <text x="80" y="352" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">AA-8000 series · NEC 310.106(B)</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="120" fill="#94A3B8" font-size="11" font-weight="700">FOR THE SAME AMPACITY</text>
    <rect x="530" y="132" width="356" height="66" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="552" y="164" fill="#EA580C" font-size="26" font-weight="800">1.59×</text>
    <text x="644" y="158" fill="#152035" font-size="13" font-weight="700">the circular mils</text>
    <text x="644" y="176" fill="#64748B" font-size="11">two AWG sizes up at 100 A and above</text>

    <text x="530" y="234" fill="#94A3B8" font-size="11" font-weight="700">AT THE SAME SIZE</text>
    <rect x="530" y="246" width="356" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="552" y="278" fill="#2563EB" font-size="26" font-weight="800">1.64×</text>
    <text x="644" y="272" fill="#152035" font-size="13" font-weight="700">less reach</text>
    <text x="644" y="290" fill="#64748B" font-size="11">K rises from 12.9 to 21.2</text>

    <rect x="530" y="330" width="356" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="708" y="359" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="800">branch circuits copper · feeders aluminum</text>

    <text x="530" y="404" fill="#94A3B8" font-size="11" font-weight="600">40 A is the one rating where both are 8 AWG</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
