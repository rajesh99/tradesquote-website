<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="pmHeroTitle pmHeroDesc">
  <title id="pmHeroTitle">PEX vs copper vs CPVC</title>
  <desc id="pmHeroDesc">Hero graphic comparing PEX, copper and CPVC at the same nominal size, showing PEX shares CPVC's friction coefficient but loses two and a half times as much pressure because its bore is smaller.</desc>

  <defs>
    <linearGradient id="pmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="pmOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pmTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pmAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="pmBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#pmBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#pmOrange)" filter="url(#pmBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#pmTeal)" filter="url(#pmBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">PEX vs copper</tspan>
    <tspan x="80" dy="40" fill="#EA580C">vs CPVC</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Nominal size is a label, not a hole</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#pmAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">three materials, three different bores</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">CPVC AT 10 GPM IN 3/4 INCH</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="159" fill="#15803D" font-size="14" font-weight="700">0.824 bore, C 150 — 7.70 psi/100</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">PEX AT 10 GPM IN 3/4 INCH</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">0.681 bore, C 150 — 19.55 psi/100</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">same C factor,</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">2.5x the loss</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">and 8.82 ft/s, already past the velocity ceiling</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">bore beats smoothness — friction goes as diameter to the 4.87</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
