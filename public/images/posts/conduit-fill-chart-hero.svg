<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="cfHeroTitle cfHeroDesc">
  <title id="cfHeroTitle">Conduit fill chart</title>
  <desc id="cfHeroDesc">Abstract hero graphic with soft gradients showing conduit cross-sections of increasing trade size filled with conductors, alongside the 40 percent fill limit.</desc>

  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="cfSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cfTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cfAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#cfBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#cfSky)" filter="url(#cfBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#cfTeal)" filter="url(#cfBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Conduit fill</tspan>
    <tspan x="80" dy="50" fill="#0284C7">chart</tspan>
  </text>
  <text x="80" y="298" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">How many wires fit — EMT, PVC, RMC</text>
  <rect x="80" y="322" width="56" height="4" rx="2" fill="url(#cfAccentBar)"/>

  <!-- Conduit cross sections -->
  <g>
    <circle cx="576" cy="196" r="40" fill="#FFFFFF" fill-opacity="0.9" stroke="#0284C7" stroke-width="3"/>
    <circle cx="564" cy="186" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="580" cy="184" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="590" cy="198" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="572" cy="202" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="586" cy="212" r="7" fill="#5EEAD4" opacity="0.8"/>
    <text x="576" y="256" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">1/2"</text>
    <text x="576" y="274" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">9 × 12 AWG</text>
  </g>

  <g>
    <circle cx="706" cy="196" r="54" fill="#FFFFFF" fill-opacity="0.9" stroke="#0284C7" stroke-width="3"/>
    <circle cx="690" cy="180" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="708" cy="176" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="724" cy="186" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="728" cy="204" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="714" cy="216" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="696" cy="214" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="684" cy="200" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="706" cy="196" r="7" fill="#5EEAD4" opacity="0.8"/>
    <text x="706" y="270" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">3/4"</text>
    <text x="706" y="288" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">16 × 12 AWG</text>
  </g>

  <g>
    <circle cx="856" cy="196" r="68" fill="#FFFFFF" fill-opacity="0.9" stroke="#01AD9F" stroke-width="3.4"/>
    <circle cx="836" cy="172" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="856" cy="166" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="876" cy="174" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="890" cy="190" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="886" cy="212" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="868" cy="226" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="846" cy="226" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="828" cy="212" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="822" cy="190" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="850" cy="192" r="7" fill="#5EEAD4" opacity="0.85"/>
    <circle cx="870" cy="198" r="7" fill="#5EEAD4" opacity="0.85"/>
    <text x="856" y="284" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">1"</text>
    <text x="856" y="302" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">26 × 12 AWG</text>
  </g>

  <!-- 40% badge -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="576" y="352" width="280" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.94" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="716" y="374" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800" letter-spacing="0.4">40% fill · three or more conductors</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
