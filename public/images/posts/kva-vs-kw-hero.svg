<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="kvHeroTitle kvHeroDesc">
  <title id="kvHeroTitle">kVA vs kW</title>
  <desc id="kvHeroDesc">Abstract hero graphic with soft gradients showing that 100 kVA at 0.8 power factor is 80 kW and 60 kVAR, a 3-4-5 right triangle.</desc>

  <defs>
    <linearGradient id="kvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="kvSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="kvTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="kvAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="kvBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#kvBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#kvSky)" filter="url(#kvBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#kvTeal)" filter="url(#kvBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="164" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">kVA vs</tspan>
    <tspan x="80" dy="42" fill="#0284C7">kW</tspan>
  </text>
  <text x="80" y="276" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">One you're billed for, one you can use</text>
  <rect x="80" y="300" width="56" height="4" rx="2" fill="url(#kvAccentBar)"/>
  <text x="80" y="348" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">kW = kVA × power factor</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- power triangle, 3-4-5 -->
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">100 kVA AT 0.8 POWER FACTOR</text>
    <line x1="556" y1="290" x2="796" y2="290" stroke="#16A34A" stroke-width="5"/>
    <line x1="796" y1="290" x2="796" y2="110" stroke="#EA580C" stroke-width="5"/>
    <line x1="556" y1="290" x2="796" y2="110" stroke="#2563EB" stroke-width="5"/>
    <rect x="778" y="272" width="18" height="18" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

    <text x="676" y="312" text-anchor="middle" fill="#15803D" font-size="14" font-weight="800">80 kW real</text>
    <text x="812" y="204" fill="#EA580C" font-size="14" font-weight="800">60 kVAR</text>
    <text x="812" y="222" fill="#94A3B8" font-size="11">reactive</text>
    <text x="620" y="182" fill="#2563EB" font-size="14" font-weight="800">100 kVA</text>
    <text x="620" y="200" fill="#94A3B8" font-size="11">apparent</text>

    <rect x="530" y="336" width="356" height="52" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="708" y="368" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="800">a 3-4-5 triangle, scaled by 20</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
