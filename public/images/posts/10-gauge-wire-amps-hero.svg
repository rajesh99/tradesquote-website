<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="tgHeroTitle tgHeroDesc">
  <title id="tgHeroTitle">10 gauge wire amps</title>
  <desc id="tgHeroDesc">Abstract hero graphic with soft gradients showing 10 AWG copper rated 30, 35 and 40 amps in the three temperature columns, with 30 amps as the breaker limit.</desc>

  <defs>
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="tgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tgTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tgAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="tgBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#tgBg)"/>
  <ellipse cx="798" cy="140" rx="200" ry="160" fill="url(#tgSky)" filter="url(#tgBlur)"/>
  <ellipse cx="656" cy="390" rx="180" ry="140" fill="url(#tgTeal)" filter="url(#tgBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="168" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">10 gauge</tspan>
    <tspan x="80" dy="42" fill="#0284C7">wire amps</tspan>
  </text>
  <text x="80" y="280" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Three ratings, one breaker limit</text>
  <rect x="80" y="304" width="56" height="4" rx="2" fill="url(#tgAccentBar)"/>
  <text x="80" y="352" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">copper · NEC Table 310.16 · 240.4(D)</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">TABLE 310.16, COPPER</text>

    <rect x="530" y="134" width="112" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="586" y="156" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">60 °C</text>
    <text x="586" y="176" text-anchor="middle" fill="#475569" font-size="18" font-weight="800">30 A</text>

    <rect x="652" y="134" width="112" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="708" y="156" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="700">75 °C</text>
    <text x="708" y="176" text-anchor="middle" fill="#2563EB" font-size="18" font-weight="800">35 A</text>

    <rect x="774" y="134" width="112" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
    <text x="830" y="156" text-anchor="middle" fill="#EA580C" font-size="10" font-weight="700">90 °C</text>
    <text x="830" y="176" text-anchor="middle" fill="#EA580C" font-size="18" font-weight="800">40 A</text>

    <text x="530" y="222" fill="#94A3B8" font-size="11" font-weight="700">240.4(D) CAPS THE BREAKER AT</text>
    <rect x="530" y="240" width="356" height="76" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="278" text-anchor="middle" fill="#0F766E" font-size="30" font-weight="800">30 A</text>
    <text x="708" y="302" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">35 A and 40 A are for derating, not for loading</text>

    <text x="530" y="350" fill="#94A3B8" font-size="11" font-weight="600">aluminum 10 AWG is capped at 25 A</text>
    <text x="530" y="374" fill="#94A3B8" font-size="11" font-weight="600">30 A at 120 V reaches only 48 ft within 3%</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
