<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="tbHeroTitle tbHeroDesc">
  <title id="tbHeroTitle">Panel is full: tandem breakers and subpanels</title>
  <desc id="tbHeroDesc">Abstract hero graphic with soft gradients showing that a full panel is a wire-landing problem rather than a capacity problem — a 200 amp service with a full panel still has 200 amps available.</desc>

  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="tbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tbTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tbAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="tbBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#tbBg)"/>
  <ellipse cx="808" cy="138" rx="200" ry="160" fill="url(#tbBlue)" filter="url(#tbBlur)"/>
  <ellipse cx="650" cy="392" rx="180" ry="140" fill="url(#tbTeal)" filter="url(#tbBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Panel is full</tspan>
    <tspan x="80" dy="42" fill="#2563EB">now what?</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Tandems, subpanels, and what is actually legal</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#tbAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 408.54 &#183; Class CTL listing</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">WHAT PEOPLE GET TOLD</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="159" fill="#B91C1C" font-size="14" font-weight="700">&#8220;You need a service upgrade.&#8221; $3,000+</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">WHAT IS USUALLY TRUE</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="249" fill="#15803D" font-size="14" font-weight="700">A subpanel. $800&#8211;$1,500.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">Spaces &#8800; amps</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a 200 A service with a full panel still has 200 A</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">408.54 caps devices at the number on the label &#8212; read it</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
