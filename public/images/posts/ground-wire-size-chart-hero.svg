<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gwHeroTitle gwHeroDesc">
  <title id="gwHeroTitle">Ground wire size chart</title>
  <desc id="gwHeroDesc">Abstract hero graphic with soft gradients contrasting the equipment grounding conductor running with a circuit against the grounding electrode conductor running to earth.</desc>

  <defs>
    <linearGradient id="gwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="gwSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gwTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gwAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="gwBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gwBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#gwSky)" filter="url(#gwBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#gwTeal)" filter="url(#gwBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="192" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Ground wire</tspan>
    <tspan x="80" dy="46" fill="#0284C7">size chart</tspan>
  </text>
  <text x="80" y="292" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">EGC vs GEC — two different tables</text>
  <rect x="80" y="316" width="56" height="4" rx="2" fill="url(#gwAccentBar)"/>

  <!-- Panel -->
  <rect x="536" y="150" width="76" height="128" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#7DD3FC" stroke-width="2"/>
  <text x="574" y="176" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">PANEL</text>
  <rect x="550" y="190" width="48" height="16" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="574" y="202" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">20 A</text>

  <!-- EGC out to a circuit -->
  <path d="M612 198 L 840 198" stroke="#01AD9F" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="856" cy="198" r="14" fill="#F0FDFA" stroke="#01AD9F" stroke-width="2"/>
  <text x="856" y="202" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">load</text>
  <text x="630" y="186" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">EGC — 12 AWG Cu</text>
  <text x="630" y="222" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Table 250.122, by breaker</text>

  <!-- GEC down to earth -->
  <path d="M574 278 L 574 356" stroke="#2563EB" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <text x="596" y="308" fill="#2563EB" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">GEC — 6 AWG Cu</text>
  <text x="596" y="326" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Table 250.66, capped for a rod</text>

  <!-- Earth line + rod -->
  <line x1="480" y1="360" x2="920" y2="360" stroke="#94A3B8" stroke-width="2.5" opacity="0.7"/>
  <line x1="574" y1="356" x2="574" y2="416" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <text x="596" y="400" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">ground rod</text>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
