<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="luHeroTitle luHeroDesc">
  <title id="luHeroTitle">Electrical labor units explained</title>
  <desc id="luHeroDesc">Abstract hero graphic with soft gradients showing a receptacle assembly built from four labour units totalling 0.80 hours, rising to 1.20 hours once an occupied-retrofit conditions factor is applied.</desc>

  <defs>
    <linearGradient id="luBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="luSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="luTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="luAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="luBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#luBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#luSky)" filter="url(#luBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#luTeal)" filter="url(#luBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Electrical</tspan>
    <tspan x="80" dy="40" fill="#0284C7">labor units</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">"Normal conditions" means new build</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#luAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NECA MLU · assemblies · your own history</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">ONE DUPLEX RECEPTACLE, BUILT UP</text>

    <rect x="530" y="134" width="356" height="48" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="164" fill="#2563EB" font-size="18" font-weight="800">0.80 h</text>
    <text x="640" y="164" fill="#94A3B8" font-size="12" font-weight="600">box + cable + device + trim</text>

    <rect x="530" y="196" width="356" height="48" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="226" fill="#EA580C" font-size="18" font-weight="800">1.20 h</text>
    <text x="640" y="226" fill="#94A3B8" font-size="12" font-weight="600">× 1.5 occupied retrofit</text>

    <rect x="530" y="266" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="294" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">50% more, same scope</text>
    <text x="708" y="316" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the conditions factor is where estimates are won</text>

    <text x="530" y="366" fill="#94A3B8" font-size="11" font-weight="600">and units exclude travel, layout and mobilisation</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
