<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="velHeroTitle velHeroDesc">
  <title id="velHeroTitle">Water velocity in pipes</title>
  <desc id="velHeroDesc">Hero graphic showing that the eight and five feet per second velocity limits are design practice rather than plumbing code, and what they cost in pipe capacity.</desc>

  <defs>
    <linearGradient id="velBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="velOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="velTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="velAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="velBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#velBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#velOrange)" filter="url(#velBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#velTeal)" filter="url(#velBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Water velocity</tspan>
    <tspan x="80" dy="40" fill="#EA580C">in pipes</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">8 cold, 5 hot — and neither is in a code</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#velAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">design practice, universally followed, never citable</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">WHAT EVERYONE QUOTES</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="159" fill="#C2410C" font-size="14" font-weight="700">8 ft/s cold · 5 ft/s hot</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">WHERE IT COMES FROM</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="249" fill="#1D4ED8" font-size="14" font-weight="700">ASPE and manufacturers — not the IPC or UPC</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">the hot ceiling costs</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">you 37% of the pipe</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">3/4 inch copper: 12.1 gpm cold, 7.5 gpm hot</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">erosion, noise and hammer — three callbacks, zero code violations</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
