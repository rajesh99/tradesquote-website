<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="peHeroTitle peHeroDesc">
  <title id="peHeroTitle">Electrical permits and inspections</title>
  <desc id="peHeroDesc">Abstract hero graphic with soft gradients showing that a 250 dollar permit is 8 percent of a 3,060 dollar panel upgrade, and that most inspection failures are a handful of repeat items.</desc>

  <defs>
    <linearGradient id="peBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="peSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="peTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="peAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="peBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#peBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#peSky)" filter="url(#peBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#peTeal)" filter="url(#peBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="156" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Permits and</tspan>
    <tspan x="80" dy="40" fill="#0284C7">inspections</tspan>
  </text>
  <text x="80" y="266" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The same items fail over and over</text>
  <rect x="80" y="290" width="56" height="4" rx="2" fill="url(#peAccentBar)"/>
  <text x="80" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">rough-in · final · and the paperwork</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">PERMIT AS A SHARE OF THE JOB</text>
    <rect x="530" y="134" width="356" height="48" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="164" fill="#2563EB" font-size="17" font-weight="800">$250</text>
    <text x="630" y="164" fill="#94A3B8" font-size="12" font-weight="600">of a $3,060 panel upgrade — 8%</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">COST OF FAILING THE INSPECTION</text>
    <rect x="530" y="224" width="356" height="48" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="254" fill="#B91C1C" font-size="17" font-weight="800">a re-inspection fee</text>
    <text x="700" y="254" fill="#94A3B8" font-size="12" font-weight="600">plus two trips and a delay</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">unpermitted work follows you</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">to the sale, the appraisal and the insurance claim</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">the inspection is a free second pair of eyes</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
