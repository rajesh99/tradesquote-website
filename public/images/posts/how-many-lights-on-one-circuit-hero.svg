<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="lcHeroTitle lcHeroDesc">
  <title id="lcHeroTitle">How many lights on one circuit</title>
  <desc id="lcHeroDesc">Abstract hero graphic with soft gradients showing that a 15 amp circuit holds about 160 nine-watt LED trims, so the dimmer rating of 16 trims is the real limit.</desc>

  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="lcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="lcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#lcBg)"/>
  <ellipse cx="804" cy="132" rx="200" ry="160" fill="url(#lcSky)" filter="url(#lcBlur)"/>
  <ellipse cx="650" cy="394" rx="180" ry="140" fill="url(#lcTeal)" filter="url(#lcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How many</tspan>
    <tspan x="80" dy="42" fill="#0284C7">lights per circuit?</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">LEDs ended the old answer</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#lcAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">no dwelling limit exists in the NEC</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">ON A 15 A CIRCUIT, 9 W LED TRIMS</text>
    <rect x="530" y="134" width="356" height="44" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="162" fill="#15803D" font-size="14" font-weight="700">circuit capacity fits</text>
    <text x="866" y="162" text-anchor="end" fill="#15803D" font-size="17" font-weight="800">160</text>

    <rect x="530" y="188" width="356" height="44" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="216" fill="#EA580C" font-size="14" font-weight="700">the dimmer allows</text>
    <text x="866" y="216" text-anchor="end" fill="#EA580C" font-size="17" font-weight="800">16</text>

    <rect x="530" y="252" width="356" height="76" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="284" text-anchor="middle" fill="#0F766E" font-size="19" font-weight="800">the dimmer is the limit</text>
    <text x="708" y="308" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">12 trims draw 108 W — nine tenths of one amp</text>

    <text x="530" y="360" fill="#94A3B8" font-size="11" font-weight="600">driver inrush, not load, is what trips breakers now</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
