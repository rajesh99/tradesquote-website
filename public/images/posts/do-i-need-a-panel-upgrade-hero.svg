<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="puHeroTitle puHeroDesc">
  <title id="puHeroTitle">Do I need a panel upgrade</title>
  <desc id="puHeroDesc">Abstract hero graphic with soft gradients showing an electrical panel with a decision fork, contrasting measured demand headroom against a full panel.</desc>

  <defs>
    <linearGradient id="puBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="puSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="puTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="puFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="puAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="puBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#puBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#puSky)" filter="url(#puBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#puTeal)" filter="url(#puBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="192" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Do I need a</tspan>
    <tspan x="80" dy="46" fill="#0284C7">panel upgrade?</tspan>
  </text>
  <text x="80" y="292" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">How to tell before spending $3,000</text>
  <rect x="80" y="316" width="56" height="4" rx="2" fill="url(#puAccentBar)"/>

  <!-- Panel with capacity gauge -->
  <rect x="528" y="120" width="150" height="230" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#7DD3FC" stroke-width="2"/>
  <text x="603" y="146" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">100 A SERVICE</text>

  <!-- gauge -->
  <rect x="556" y="160" width="94" height="160" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="556" y="232" width="94" height="88" rx="8" fill="url(#puFill)"/>
  <line x1="548" y1="232" x2="658" y2="232" stroke="#01AD9F" stroke-width="2.4" stroke-dasharray="5 3"/>
  <text x="603" y="284" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">55 A</text>
  <text x="603" y="302" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">measured × 125%</text>
  <text x="603" y="340" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">45 A headroom</text>

  <!-- Verdict cards -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="706" y="150" width="190" height="82" rx="12" fill="#F0FDF4" fill-opacity="0.95" stroke="#16A34A" stroke-width="2"/>
    <text x="726" y="176" fill="#15803D" font-size="13" font-weight="800">32 A charger</text>
    <text x="726" y="198" fill="#166534" font-size="17" font-weight="800">95 A — fits</text>
    <text x="726" y="217" fill="#64748B" font-size="10" font-weight="500">no upgrade needed</text>

    <rect x="706" y="248" width="190" height="82" rx="12" fill="#FEF2F2" fill-opacity="0.95" stroke="#DC2626" stroke-width="2"/>
    <text x="726" y="274" fill="#B91C1C" font-size="13" font-weight="800">48 A charger</text>
    <text x="726" y="296" fill="#991B1B" font-size="17" font-weight="800">115 A — over</text>
    <text x="726" y="315" fill="#64748B" font-size="10" font-weight="500">upgrade or load management</text>
  </g>

  <!-- Badge -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="528" y="378" width="230" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="643" y="399" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800" letter-spacing="0.4">NEC 220.87 · measured demand</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
