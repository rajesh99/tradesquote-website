<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">What size wire do I need</title>
  <desc id="heroDesc">Abstract hero graphic with soft gradients showing conductors of increasing gauge, an ampacity badge and a voltage drop curve, representing wire sizing by amps and distance.</desc>

  <defs>
    <linearGradient id="wsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="wsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wsTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wsCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wsAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="wsBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="wsGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#wsBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#wsSky)" filter="url(#wsBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#wsTeal)" filter="url(#wsBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">What size wire</tspan>
    <tspan x="80" dy="50" fill="#0284C7">do I need?</tspan>
  </text>
  <text x="80" y="298" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Amps, distance, and material</text>
  <rect x="80" y="322" width="56" height="4" rx="2" fill="url(#wsAccentBar)"/>

  <!-- Conductors of increasing gauge -->
  <g>
    <rect x="530" y="132" width="330" height="10" rx="5" fill="url(#wsCopper)"/>
    <text x="880" y="142" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">14</text>
    <rect x="530" y="160" width="330" height="16" rx="8" fill="url(#wsCopper)"/>
    <text x="880" y="173" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">12</text>
    <rect x="530" y="194" width="330" height="24" rx="12" fill="url(#wsCopper)"/>
    <text x="880" y="211" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">10</text>
    <rect x="530" y="236" width="330" height="34" rx="17" fill="url(#wsCopper)"/>
    <text x="880" y="258" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">6</text>
  </g>

  <!-- Voltage drop curve: drop grows with distance -->
  <path d="M530 380 C 620 380, 700 372, 860 340" stroke="#01AD9F" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#wsGlow)"/>
  <circle cx="860" cy="340" r="7" fill="#01AD9F" opacity="0.9"/>
  <text x="530" y="410" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">voltage drop grows with distance</text>

  <!-- Ampacity badge -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="530" y="296" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="605" y="316" text-anchor="middle" fill="#0369A1" font-size="12" font-weight="700" letter-spacing="1">NEC 310.16</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
