<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="soHeroTitle soHeroDesc">
  <title id="soHeroTitle">Standard vs optional load calculation</title>
  <desc id="soHeroDesc">Abstract hero graphic with soft gradients showing that Article 220 offers five load calculation routes rather than two, and that the situation usually determines which one applies.</desc>

  <defs>
    <linearGradient id="soBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="soIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="soTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="soAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="soBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#soBg)"/>
  <ellipse cx="808" cy="136" rx="200" ry="160" fill="url(#soIndigo)" filter="url(#soBlur)"/>
  <ellipse cx="650" cy="394" rx="180" ry="140" fill="url(#soTeal)" filter="url(#soBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Standard vs</tspan>
    <tspan x="80" dy="42" fill="#4F46E5">optional</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Which load calculation method to use</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#soAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 220 Part III &#183; 220.82 &#183; .83 &#183; .84 &#183; .87</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">HOW IT IS USUALLY FRAMED</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="550" y="159" fill="#334155" font-size="14" font-weight="700">Two methods. Pick the smaller one.</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">WHAT ARTICLE 220 ACTUALLY OFFERS</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.4"/>
    <text x="550" y="249" fill="#4338CA" font-size="14" font-weight="700">Five routes, and the job picks one.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">122.2 &#183; 101.2 &#183; 55.0 A</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">one house, standard, optional and measured</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">220.87 measured demand is the one that usually wins</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
