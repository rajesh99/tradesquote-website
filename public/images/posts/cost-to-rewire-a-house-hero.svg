<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="rwHeroTitle rwHeroDesc">
  <title id="rwHeroTitle">Cost to rewire a house</title>
  <desc id="rwHeroDesc">Abstract hero graphic with soft gradients showing a house outline with cost per square foot rising across three access difficulty levels.</desc>

  <defs>
    <linearGradient id="rwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="rwSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rwTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rwAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="rwBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#rwBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#rwSky)" filter="url(#rwBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#rwTeal)" filter="url(#rwBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="184" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Cost to rewire</tspan>
    <tspan x="80" dy="44" fill="#0284C7">a house</tspan>
  </text>
  <text x="80" y="290" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Per square foot, by age and access</text>
  <rect x="80" y="314" width="56" height="4" rx="2" fill="url(#rwAccentBar)"/>

  <!-- House outline -->
  <path d="M560 250 L 700 154 L 840 250 L 840 360 L 560 360 Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#7DD3FC" stroke-width="2.4"/>
  <path d="M560 250 L 700 154 L 840 250" fill="none" stroke="#0284C7" stroke-width="2.6" opacity="0.7"/>
  <rect x="676" y="300" width="48" height="60" rx="3" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.4"/>

  <!-- Wiring runs inside -->
  <path d="M590 282 L 620 282 L 620 330 L 660 330" stroke="#01AD9F" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M740 330 L 786 330 L 786 276 L 812 276" stroke="#01AD9F" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M700 200 L 700 246" stroke="#01AD9F" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="590" cy="282" r="4.5" fill="#01AD9F" opacity="0.85"/>
  <circle cx="812" cy="276" r="4.5" fill="#01AD9F" opacity="0.85"/>

  <!-- Per-sqft ladder -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="386" width="118" height="52" rx="11" fill="#F0FDF4" fill-opacity="0.95" stroke="#16A34A" stroke-width="1.8"/>
    <text x="583" y="408" text-anchor="middle" fill="#15803D" font-size="15" font-weight="800">$6.34</text>
    <text x="583" y="426" text-anchor="middle" fill="#64748B" font-size="9.5" font-weight="500">easy access</text>

    <rect x="652" y="386" width="118" height="52" rx="11" fill="#F0FDFA" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="711" y="408" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="800">$9.64</text>
    <text x="711" y="426" text-anchor="middle" fill="#64748B" font-size="9.5" font-weight="500">average</text>

    <rect x="780" y="386" width="118" height="52" rx="11" fill="#FEF2F2" fill-opacity="0.95" stroke="#DC2626" stroke-width="1.8"/>
    <text x="839" y="408" text-anchor="middle" fill="#B91C1C" font-size="15" font-weight="800">$15.14</text>
    <text x="839" y="426" text-anchor="middle" fill="#64748B" font-size="9.5" font-weight="500">difficult</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
