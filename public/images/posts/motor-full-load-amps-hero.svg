<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="mfHeroTitle mfHeroDesc">
  <title id="mfHeroTitle">Motor full load amps</title>
  <desc id="mfHeroDesc">Abstract hero graphic with soft gradients showing that conductors and overcurrent protection use the NEC table value of 14 amps while the overload device uses the 13 amp nameplate value.</desc>

  <defs>
    <linearGradient id="mfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="mfSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mfTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="mfAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="mfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#mfBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#mfSky)" filter="url(#mfBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#mfTeal)" filter="url(#mfBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Motor full</tspan>
    <tspan x="80" dy="42" fill="#0284C7">load amps</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The table, not the nameplate</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#mfAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 430.6(A)(1) · Table 430.250</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">10 HP, 3-PHASE, 460 V</text>

    <rect x="530" y="134" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="550" y="163" fill="#2563EB" font-size="13.5" font-weight="700">Table 430.250 says 14.0 A</text>

    <rect x="530" y="190" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="550" y="219" fill="#EA580C" font-size="13.5" font-weight="700">the nameplate says 13.0 A</text>

    <rect x="530" y="256" width="172" height="66" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#2563EB" stroke-width="2.4"/>
    <text x="616" y="280" text-anchor="middle" fill="#2563EB" font-size="11" font-weight="800">TABLE</text>
    <text x="616" y="300" text-anchor="middle" fill="#152035" font-size="12" font-weight="700">conductors</text>
    <text x="616" y="315" text-anchor="middle" fill="#152035" font-size="12" font-weight="700">and breaker</text>

    <rect x="714" y="256" width="172" height="66" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#EA580C" stroke-width="2.4"/>
    <text x="800" y="280" text-anchor="middle" fill="#EA580C" font-size="11" font-weight="800">NAMEPLATE</text>
    <text x="800" y="300" text-anchor="middle" fill="#152035" font-size="12" font-weight="700">overload</text>
    <text x="800" y="315" text-anchor="middle" fill="#152035" font-size="12" font-weight="700">device only</text>

    <text x="530" y="356" fill="#94A3B8" font-size="11" font-weight="600">the table runs 7.7% above the nameplate here</text>
    <text x="530" y="378" fill="#94A3B8" font-size="11" font-weight="600">mixing them up is the commonest motor error</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
