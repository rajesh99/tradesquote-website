<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="waHeroTitle waHeroDesc">
  <title id="waHeroTitle">Watts to amps</title>
  <desc id="waHeroDesc">Abstract hero graphic with soft gradients showing a wattage figure dividing by volts and power factor to give amps, in DC, single-phase and three-phase forms.</desc>

  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="waSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="waTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="waAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="waBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#waBg)"/>
  <ellipse cx="800" cy="140" rx="200" ry="160" fill="url(#waSky)" filter="url(#waBlur)"/>
  <ellipse cx="660" cy="392" rx="180" ry="140" fill="url(#waTeal)" filter="url(#waBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="184" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Watts</tspan>
    <tspan x="80" dy="44" fill="#0284C7">to amps</tspan>
  </text>
  <text x="80" y="290" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">DC, single-phase and three-phase</text>
  <rect x="80" y="314" width="56" height="4" rx="2" fill="url(#waAccentBar)"/>

  <!-- Three divisors -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="530" y="118" width="360" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="550" y="140" fill="#2563EB" font-size="11" font-weight="800">DC</text>
    <text x="600" y="147" fill="#152035" font-size="17" font-weight="800">I = P ÷ V</text>

    <rect x="530" y="176" width="360" height="46" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
    <text x="550" y="198" fill="#EA580C" font-size="11" font-weight="800">1φ</text>
    <text x="600" y="205" fill="#152035" font-size="17" font-weight="800">I = P ÷ (V × PF)</text>

    <rect x="530" y="234" width="360" height="46" rx="10" fill="#E8F8F6" stroke="#01AD9F" stroke-width="1.8"/>
    <text x="550" y="256" fill="#0F766E" font-size="11" font-weight="800">3φ</text>
    <text x="600" y="263" fill="#152035" font-size="17" font-weight="800">I = P ÷ (√3 × V × PF)</text>

    <rect x="530" y="304" width="360" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="710" y="330" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">1,800 W ÷ 120 V = 15 A</text>
    <text x="710" y="352" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">continuous, so the circuit is 20 A — not 15</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
