<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="pucHeroTitle pucHeroDesc">
  <title id="pucHeroTitle">Electrical panel upgrade cost</title>
  <desc id="pucHeroDesc">Abstract hero graphic with soft gradients showing panel upgrade cost line items stacking to a total.</desc>

  <defs>
    <linearGradient id="pucBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="pucSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pucTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pucAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="pucBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#pucBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#pucSky)" filter="url(#pucBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#pucTeal)" filter="url(#pucBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="180" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Panel upgrade</tspan>
    <tspan x="80" dy="44" fill="#0284C7">cost</tspan>
  </text>
  <text x="80" y="286" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">100 A to 200 A, line by line</text>
  <rect x="80" y="310" width="56" height="4" rx="2" fill="url(#pucAccentBar)"/>

  <!-- Line items -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
    <rect x="524" y="128" width="366" height="24" rx="5" fill="#CCFBF1" stroke="#01AD9F" stroke-width="1.1"/>
    <text x="540" y="145" fill="#0F766E">panel + breakers</text>
    <text x="874" y="145" text-anchor="end" fill="#0F766E" font-weight="800">$900</text>

    <rect x="524" y="158" width="366" height="24" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.1"/>
    <text x="540" y="175" fill="#2563EB">labor · 10 h</text>
    <text x="874" y="175" text-anchor="end" fill="#2563EB" font-weight="800">$950</text>

    <rect x="524" y="188" width="366" height="24" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.1"/>
    <text x="540" y="205" fill="#C2410C">conductors · 30 ft</text>
    <text x="874" y="205" text-anchor="end" fill="#C2410C" font-weight="800">$360</text>

    <rect x="524" y="218" width="366" height="24" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.1"/>
    <text x="540" y="235" fill="#15803D">meter socket</text>
    <text x="874" y="235" text-anchor="end" fill="#15803D" font-weight="800">$250</text>

    <rect x="524" y="248" width="366" height="24" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.1"/>
    <text x="540" y="265" fill="#64748B">mast / riser</text>
    <text x="874" y="265" text-anchor="end" fill="#64748B" font-weight="800">$350</text>

    <rect x="524" y="278" width="366" height="24" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.1"/>
    <text x="540" y="295" fill="#B91C1C">permit</text>
    <text x="874" y="295" text-anchor="end" fill="#B91C1C" font-weight="800">$250</text>

    <line x1="524" y1="314" x2="890" y2="314" stroke="#152035" stroke-width="1.2"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="614" y="328" width="276" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="752" y="356" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">$3,060</text>
    <text x="752" y="376" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="500">average-cost region, 2026</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
