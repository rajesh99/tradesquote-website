<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="fcHeroTitle fcHeroDesc">
  <title id="fcHeroTitle">Available fault current</title>
  <desc id="fcHeroDesc">Abstract hero graphic with soft gradients showing 11,455 amps at a transformer secondary falling to 8,626 amps after 100 feet of 4/0 copper, which moves the equipment requirement from 22 kA to 10 kA.</desc>

  <defs>
    <linearGradient id="fcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="fcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="fcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="fcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#fcBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#fcSky)" filter="url(#fcBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#fcTeal)" filter="url(#fcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Available</tspan>
    <tspan x="80" dy="40" fill="#0284C7">fault current</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Distance is your cheapest ally</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#fcAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">300 kVA · 480 V 3φ · %Z 3.5</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">AT THE TRANSFORMER SECONDARY</text>
    <rect x="530" y="134" width="356" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="167" fill="#B91C1C" font-size="19" font-weight="800">11,455 A</text>
    <text x="700" y="167" fill="#94A3B8" font-size="12" font-weight="600">needs 22 kA equipment</text>

    <text x="530" y="216" fill="#94A3B8" font-size="11" font-weight="700">AFTER 100 FT OF 4/0 COPPER</text>
    <rect x="530" y="228" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="261" fill="#15803D" font-size="19" font-weight="800">8,626 A</text>
    <text x="700" y="261" fill="#94A3B8" font-size="12" font-weight="600">10 kA equipment will do</text>

    <rect x="530" y="300" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="328" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">100 ft sheds 25%</text>
    <text x="708" y="350" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">enough to change what you're allowed to install</text>

    <text x="530" y="392" fill="#94A3B8" font-size="11" font-weight="600">use the −10% impedance case — it's the worst one</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
