<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gcHeroTitle gcHeroDesc">
  <title id="gcHeroTitle">Standby generator installation cost</title>
  <desc id="gcHeroDesc">Abstract hero graphic with soft gradients showing that a typical 22 kilowatt whole-house standby costs about $10,990 installed, of which the generator itself is only 53 percent.</desc>

  <defs>
    <linearGradient id="gcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="gcOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="gcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gcBg)"/>
  <ellipse cx="810" cy="136" rx="200" ry="160" fill="url(#gcOrange)" filter="url(#gcBlur)"/>
  <ellipse cx="648" cy="394" rx="180" ry="140" fill="url(#gcTeal)" filter="url(#gcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Standby generator</tspan>
    <tspan x="80" dy="42" fill="#EA580C">installation cost</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The machine is barely half the invoice</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#gcAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">2026 US market planning figures</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">A 22 kW WHOLE-HOUSE STANDBY</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="159" fill="#C2410C" font-size="14" font-weight="700">$10,990 installed</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">OF WHICH THE GENERATOR IS</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="550" y="249" fill="#334155" font-size="14" font-weight="700">$5,800 &#8212; just 53%</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">Switch, gas, pad, permit, labor</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the other $5,190, and it barely scales with size</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">702.4(B)(2) lets load management shrink the machine</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
