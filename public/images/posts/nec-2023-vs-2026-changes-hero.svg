<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="n26HeroTitle n26HeroDesc">
  <title id="n26HeroTitle">NEC 2023 vs 2026 changes</title>
  <desc id="n26HeroDesc">Abstract hero graphic with soft gradients showing that the 2023 edition is what most jurisdictions are moving to while the 2026 edition was published in 2025 and adoption has barely begun.</desc>

  <defs>
    <linearGradient id="n26Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="n26Sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="n26Teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="n26AccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="n26Blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#n26Bg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#n26Sky)" filter="url(#n26Blur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#n26Teal)" filter="url(#n26Blur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">NEC 2023</tspan>
    <tspan x="80" dy="42" fill="#0284C7">vs 2026</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">One is arriving, one is barely published</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#n26AccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">check the adopted edition before either</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">NEC 2023</text>
    <rect x="530" y="134" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="155" fill="#15803D" font-size="13.5" font-weight="700">published 2022 · widely adopted</text>
    <text x="550" y="175" fill="#64748B" font-size="11">settled changes, worth learning properly</text>

    <text x="530" y="216" fill="#94A3B8" font-size="11" font-weight="700">NEC 2026</text>
    <rect x="530" y="228" width="356" height="52" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
    <text x="550" y="249" fill="#EA580C" font-size="13.5" font-weight="700">published Aug 2025 · adoption starting</text>
    <text x="550" y="269" fill="#64748B" font-size="11">verify against the text, not a summary</text>

    <rect x="530" y="298" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="326" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="800">most jobs are still on 2020</text>
    <text x="708" y="348" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">so the useful comparison is often 2020 vs 2023</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">the direction of travel: GFCI scope and electrification</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
