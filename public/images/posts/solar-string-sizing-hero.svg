<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="s2HeroTitle s2HeroDesc">
  <title id="s2HeroTitle">Solar string sizing</title>
  <desc id="s2HeroDesc">Abstract hero graphic with soft gradients showing that cold weather sets the maximum string length because open-circuit voltage rises as cells chill, while heat sets the minimum because maximum-power voltage falls.</desc>

  <defs>
    <linearGradient id="s2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="s2Cold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="s2Hot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="s2AccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="s2Blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#s2Bg)"/>
  <ellipse cx="808" cy="134" rx="200" ry="160" fill="url(#s2Cold)" filter="url(#s2Blur)"/>
  <ellipse cx="650" cy="394" rx="180" ry="140" fill="url(#s2Hot)" filter="url(#s2Blur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Solar string</tspan>
    <tspan x="80" dy="42" fill="#0284C7">sizing</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Two temperatures bound every string</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#s2AccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 690.7 &#183; lowest expected ambient</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">COLD SETS THE MAXIMUM</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.4"/>
    <text x="550" y="159" fill="#0369A1" font-size="14" font-weight="700">Voc climbs. 11 modules, not 12.</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">HEAT SETS THE MINIMUM</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="249" fill="#C2410C" font-size="14" font-weight="700">Vmp falls. At least 3 to track.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">Get the top wrong once</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">and the inverter dies on the first cold clear morning</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">use the datasheet coefficient &#8212; Table 690.7 costs a module</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
