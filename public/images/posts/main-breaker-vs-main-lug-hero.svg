<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="mlHeroTitle mlHeroDesc">
  <title id="mlHeroTitle">Main breaker vs main lug panels</title>
  <desc id="mlHeroDesc">Abstract hero graphic with soft gradients contrasting a main breaker panel, which contains its own disconnect, with a main lug only panel, which is protected by an upstream device.</desc>

  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="mlSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mlTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="mlAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="mlBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#mlBg)"/>
  <ellipse cx="802" cy="136" rx="200" ry="160" fill="url(#mlSky)" filter="url(#mlBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#mlTeal)" filter="url(#mlBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Main breaker</tspan>
    <tspan x="80" dy="40" fill="#0284C7">or main lug?</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Where the disconnect lives</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#mlAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 230.71 · 408.36 · 225.31</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="120" fill="#94A3B8" font-size="11" font-weight="700">MAIN BREAKER</text>
    <rect x="530" y="132" width="356" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="153" fill="#2563EB" font-size="13" font-weight="700">its own disconnect, inside</text>
    <text x="550" y="172" fill="#64748B" font-size="10.5">service panels · detached buildings</text>

    <text x="530" y="216" fill="#94A3B8" font-size="11" font-weight="700">MAIN LUG ONLY</text>
    <rect x="530" y="228" width="356" height="52" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="249" fill="#EA580C" font-size="13" font-weight="700">protected upstream</text>
    <text x="550" y="268" fill="#64748B" font-size="10.5">subpanels in the same building</text>

    <rect x="530" y="300" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="328" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">the six-handle panel is gone</text>
    <text x="708" y="350" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">NEC 2020: one service disconnect per enclosure</text>

    <text x="530" y="396" fill="#94A3B8" font-size="11" font-weight="600">two to six are still allowed — in separate enclosures</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
