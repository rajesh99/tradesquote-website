<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="frHeroTitle frHeroDesc">
  <title id="frHeroTitle">Flat rate vs time and materials</title>
  <desc id="frHeroDesc">Abstract hero graphic with soft gradients showing that flat rate transfers estimating risk to the contractor, so it must be priced on average time rather than best-case time.</desc>

  <defs>
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="frSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="frTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="frAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="frBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#frBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#frSky)" filter="url(#frBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#frTeal)" filter="url(#frBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="156" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Flat rate or</tspan>
    <tspan x="80" dy="38" fill="#0284C7">time and materials?</tspan>
  </text>
  <text x="80" y="264" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The question is who carries the risk</text>
  <rect x="80" y="288" width="56" height="4" rx="2" fill="url(#frAccentBar)"/>
  <text x="80" y="336" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">price on average time, never best case</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">PRICED ON THE BEST CASE, 1.5 h</text>
    <rect x="530" y="134" width="356" height="48" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="164" fill="#B91C1C" font-size="17" font-weight="800">$242</text>
    <text x="640" y="164" fill="#94A3B8" font-size="12" font-weight="600">and it takes 2.5 h → you lose</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">PRICED ON THE AVERAGE, 2.2 h</text>
    <rect x="530" y="224" width="356" height="48" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="254" fill="#15803D" font-size="17" font-weight="800">$348</text>
    <text x="640" y="254" fill="#94A3B8" font-size="12" font-weight="600">the fast ones fund the slow ones</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">flat rate is an average</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">so it only works across a volume of jobs</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">T&amp;M puts the same risk on the customer</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
