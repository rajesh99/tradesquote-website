<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="waterHammerHeroTitle waterHammerHeroDesc">
  <title id="waterHammerHeroTitle">Water hammer causes and fixes: why pipes bang</title>
  <desc id="waterHammerHeroDesc">Slamming a valve at ten gallons a minute in three-quarter inch copper spikes the line to about 357 psi. The same flow in PEX gives 116. Strapping the pipe silences the noise and leaves the pressure.</desc>

  <defs>
    <linearGradient id="waterHammerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="waterHammerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="waterHammerTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="waterHammerAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="waterHammerBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#waterHammerBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#waterHammerOrange)" filter="url(#waterHammerBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#waterHammerTeal)" filter="url(#waterHammerBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Water hammer:</tspan>
    <tspan x="80" dy="40" fill="#EA580C">why pipes bang</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The bang is a pressure wave,</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#waterHammerAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">not the pipe hitting the framing</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">10 GPM IN 3/4in COPPER</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="159" fill="#B91C1C" font-size="14" font-weight="700">6.63 ft/s  →  about 357 psi</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">SAME FLOW IN PEX</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="249" fill="#15803D" font-size="14" font-weight="700">about 116 psi  ·  3.1x gentler</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">Strapping the pipe</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">fixes only the noise</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the fittings keep taking the full spike</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">Arrestors are consumables: a flat one looks exactly like a live one</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
