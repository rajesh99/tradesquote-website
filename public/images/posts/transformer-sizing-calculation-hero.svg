<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="tsHeroTitle tsHeroDesc">
  <title id="tsHeroTitle">Transformer sizing</title>
  <desc id="tsHeroDesc">Abstract hero graphic with soft gradients showing that a transformer primary device may be set at 250 percent where secondary protection is provided, versus 125 percent where it is not.</desc>

  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="tsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tsTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tsAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="tsBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#tsBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#tsSky)" filter="url(#tsBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#tsTeal)" filter="url(#tsBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Transformer</tspan>
    <tspan x="80" dy="42" fill="#0284C7">sizing</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">450.3 protects the transformer</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#tsAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">not the secondary conductors — that's 240.21(C)</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">75 kVA, 480 → 208 V, 3φ · PRIMARY FLA 90.21 A</text>

    <rect x="530" y="136" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="157" fill="#94A3B8" font-size="10" font-weight="700">WITH SECONDARY PROTECTION</text>
    <text x="550" y="178" fill="#15803D" font-size="15" font-weight="800">250% → a 225 A primary device</text>

    <rect x="530" y="200" width="356" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="221" fill="#94A3B8" font-size="10" font-weight="700">WITHOUT IT</text>
    <text x="550" y="242" fill="#B91C1C" font-size="15" font-weight="800">125% → 110 A, and it halves</text>

    <rect x="530" y="278" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="306" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">inrush is why 250% exists</text>
    <text x="708" y="330" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">magnetising current would trip anything tighter</text>

    <text x="530" y="376" fill="#94A3B8" font-size="11" font-weight="600">and under 9 A the band rises to 167%</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
