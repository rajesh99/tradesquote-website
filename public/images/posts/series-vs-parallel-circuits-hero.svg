<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="spHeroTitle spHeroDesc">
  <title id="spHeroTitle">Series versus parallel circuits</title>
  <desc id="spHeroDesc">Abstract hero graphic showing that three identical elements draw 120 watts wired in series and 1,080 watts wired in parallel — nine times the power from the same parts.</desc>

  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="spSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="spTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="spAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="spBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#spBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#spSky)" filter="url(#spBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#spTeal)" filter="url(#spBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="164" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Series vs</tspan>
    <tspan x="80" dy="42" fill="#0284C7">parallel</tspan>
  </text>
  <text x="80" y="276" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">One shares current, one shares voltage</text>
  <rect x="80" y="300" width="56" height="4" rx="2" fill="url(#spAccentBar)"/>
  <text x="80" y="348" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Three 40 Ω elements · 120 V</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">WIRED IN SERIES</text>
    <rect x="530" y="134" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="163" fill="#C2410C" font-size="14" font-weight="700">1.00 A · 40 V each · 120 W total</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">WIRED IN PARALLEL</text>
    <rect x="530" y="224" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="253" fill="#15803D" font-size="14" font-weight="700">9.00 A · 120 V each · 1,080 W total</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="800">9× the power</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">same three parts — n elements give exactly n²</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">every building circuit is parallel; only the switch is in series</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
