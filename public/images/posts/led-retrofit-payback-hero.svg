<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="lpHeroTitle lpHeroDesc">
  <title id="lpHeroTitle">LED retrofit payback</title>
  <desc id="lpHeroDesc">Abstract hero graphic with soft gradients showing that identical LED hardware pays back eight times faster at 24 hours a day than at 3 hours a day, because operating hours dominate.</desc>

  <defs>
    <linearGradient id="lpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="lpSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lpTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lpAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="lpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#lpBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#lpSky)" filter="url(#lpBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#lpTeal)" filter="url(#lpBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">LED retrofit</tspan>
    <tspan x="80" dy="42" fill="#0284C7">payback</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Hours matter more than watts</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#lpAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">kWh = W × h ÷ 1,000 · at $0.17/kWh</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">SAME TEN FIXTURES, 100 W → 15 W</text>

    <rect x="530" y="134" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="163" fill="#B91C1C" font-size="14" font-weight="700">3 h/day → 2.34 years</text>

    <rect x="530" y="190" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="219" fill="#EA580C" font-size="14" font-weight="700">12 h/day → 0.58 years</text>

    <rect x="530" y="246" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="275" fill="#15803D" font-size="14" font-weight="700">24 h/day → 0.29 years</text>

    <rect x="530" y="308" width="356" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="334" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="800">8× faster</text>
    <text x="708" y="356" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">identical hardware, identical cost</text>

    <text x="530" y="394" fill="#94A3B8" font-size="11" font-weight="600">so retrofit the corridor before the store room</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
