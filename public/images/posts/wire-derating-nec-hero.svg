<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="wdHeroTitle wdHeroDesc">
  <title id="wdHeroTitle">Wire derating for ambient temperature and conductor bundling</title>
  <desc id="wdHeroDesc">Abstract hero graphic with soft gradients showing that derating must start from the 90 degree Celsius column, giving 21.84 amps, where starting from the 75 degree column wrongly gives 17.6 amps.</desc>

  <defs>
    <linearGradient id="wdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="wdSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wdTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wdAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="wdBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#wdBg)"/>
  <ellipse cx="806" cy="132" rx="200" ry="160" fill="url(#wdSky)" filter="url(#wdBlur)"/>
  <ellipse cx="648" cy="396" rx="180" ry="140" fill="url(#wdTeal)" filter="url(#wdBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="168" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Wire</tspan>
    <tspan x="80" dy="42" fill="#0284C7">derating</tspan>
  </text>
  <text x="80" y="280" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Ambient heat and bundling, stacked</text>
  <rect x="80" y="304" width="56" height="4" rx="2" fill="url(#wdAccentBar)"/>
  <text x="80" y="352" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">12 AWG THHN · 6 conductors · 40 °C</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="126" fill="#94A3B8" font-size="11" font-weight="700">START AT THE 90 °C COLUMN</text>
    <rect x="530" y="136" width="356" height="38" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="548" y="161" fill="#15803D" font-size="14" font-weight="700">30 × 0.91 × 0.80</text>
    <text x="868" y="161" text-anchor="end" fill="#15803D" font-size="16" font-weight="800">21.84 A</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">START AT THE 75 °C COLUMN</text>
    <rect x="530" y="222" width="356" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="548" y="247" fill="#B91C1C" font-size="14" font-weight="700">25 × 0.88 × 0.80</text>
    <text x="868" y="247" text-anchor="end" fill="#B91C1C" font-size="16" font-weight="800">17.60 A</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="324" text-anchor="middle" fill="#0F766E" font-size="26" font-weight="800">20 A holds</text>
    <text x="708" y="348" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the 90 °C column is a derating base, not an ampacity</text>

    <text x="530" y="392" fill="#94A3B8" font-size="11" font-weight="600">one wrong column and you upsize a circuit that was already legal</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
