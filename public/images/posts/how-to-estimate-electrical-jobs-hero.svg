<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="eeHeroTitle eeHeroDesc">
  <title id="eeHeroTitle">How to estimate electrical jobs</title>
  <desc id="eeHeroDesc">Abstract hero graphic with soft gradients showing an estimate building from labor and material through overhead to a priced total.</desc>

  <defs>
    <linearGradient id="eeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="eeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="eeTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="eeAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="eeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#eeBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#eeSky)" filter="url(#eeBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#eeTeal)" filter="url(#eeBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="176" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How to estimate</tspan>
    <tspan x="80" dy="42" fill="#0284C7">electrical jobs</tspan>
  </text>
  <text x="80" y="282" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Takeoff, assemblies, labor units</text>
  <rect x="80" y="306" width="56" height="4" rx="2" fill="url(#eeAccentBar)"/>

  <!-- Build-up bars -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
    <rect x="524" y="136" width="180" height="26" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="540" y="154" fill="#2563EB">labor</text>
    <text x="690" y="154" text-anchor="end" fill="#2563EB" font-weight="800">$1,140</text>

    <rect x="524" y="168" width="248" height="26" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="540" y="186" fill="#2563EB">+ material &amp; fixtures</text>
    <text x="758" y="186" text-anchor="end" fill="#2563EB" font-weight="800">$2,590</text>

    <rect x="524" y="200" width="284" height="26" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
    <text x="540" y="218" fill="#C2410C">+ 15% overhead</text>
    <text x="794" y="218" text-anchor="end" fill="#C2410C" font-weight="800">$2,979</text>

    <rect x="524" y="232" width="366" height="30" rx="6" fill="#F0FDFA" stroke="#01AD9F" stroke-width="2"/>
    <text x="540" y="252" fill="#0F766E" font-weight="800">÷ 0.75 for 25% margin</text>
    <text x="876" y="252" text-anchor="end" fill="#0F766E" font-weight="800">$3,971</text>
  </g>

  <!-- The trap -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="292" width="366" height="86" rx="14" fill="#FEF2F2" fill-opacity="0.95" stroke="#DC2626" stroke-width="2"/>
    <text x="546" y="318" fill="#B91C1C" font-size="12.5" font-weight="800">The markup trap</text>
    <text x="546" y="340" fill="#64748B" font-size="11" font-weight="500">× 1.25 instead prices it at $3,723</text>
    <text x="546" y="362" fill="#B91C1C" font-size="14" font-weight="800">$248 less profit, same job</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
