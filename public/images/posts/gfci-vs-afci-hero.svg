<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gaHeroTitle gaHeroDesc">
  <title id="gaHeroTitle">GFCI vs AFCI</title>
  <desc id="gaHeroDesc">Abstract hero graphic with soft gradients contrasting a ground-fault device detecting leakage current against an arc-fault device detecting an arcing signature.</desc>

  <defs>
    <linearGradient id="gaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="gaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gaTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gaAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="gaBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="gaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gaBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#gaSky)" filter="url(#gaBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#gaTeal)" filter="url(#gaBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">GFCI vs</tspan>
    <tspan x="80" dy="52" fill="#0284C7">AFCI</tspan>
  </text>
  <text x="80" y="300" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">What each protects, and where</text>
  <rect x="80" y="324" width="56" height="4" rx="2" fill="url(#gaAccentBar)"/>

  <!-- GFCI: current out vs back -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="520" y="128" width="374" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#93C5FD" stroke-width="2"/>
    <text x="542" y="154" fill="#2563EB" font-size="13" font-weight="800">GFCI — current going missing</text>
    <path d="M548 180 L 820 180" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <text x="548" y="174" fill="#94A3B8" font-size="9.5">out 8.000 A</text>
    <path d="M820 206 L 548 206" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
    <text x="548" y="222" fill="#94A3B8" font-size="9.5">back 7.995 A</text>
    <path d="M820 180 L 848 196 L 820 206" fill="#DC2626" opacity="0.55"/>
    <text x="856" y="200" fill="#B91C1C" font-size="11" font-weight="800">5 mA</text>
  </g>

  <!-- AFCI: arc signature -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="520" y="256" width="374" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#FDBA74" stroke-width="2"/>
    <text x="542" y="282" fill="#EA580C" font-size="13" font-weight="800">AFCI — the shape of a spark</text>
    <path d="M548 322 L 572 322 L 580 302 L 592 340 L 604 306 L 616 336 L 628 314 L 648 322 L 700 322 L 712 300 L 724 342 L 736 308 L 748 330 L 760 322 L 866 322"
          stroke="#EA580C" stroke-width="2.6" fill="none" stroke-linecap="round" filter="url(#gaGlow)"/>
    <text x="548" y="352" fill="#94A3B8" font-size="9.5">high-frequency pattern, not a threshold</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
