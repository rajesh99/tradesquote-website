<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="acHeroTitle acHeroDesc">
  <title id="acHeroTitle">AC versus DC explained</title>
  <desc id="acHeroDesc">Abstract hero graphic contrasting alternating current, which reverses 120 times a second and peaks at 169.7 volts, with direct current, which holds a steady level.</desc>

  <defs>
    <linearGradient id="acBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="acSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="acTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="acAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="acBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#acBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#acSky)" filter="url(#acBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#acTeal)" filter="url(#acBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="164" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">AC vs</tspan>
    <tspan x="80" dy="42" fill="#0284C7">DC</tspan>
  </text>
  <text x="80" y="276" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">One reverses, one holds steady</text>
  <rect x="80" y="300" width="56" height="4" rx="2" fill="url(#acAccentBar)"/>
  <text x="80" y="348" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">60 Hz · 16.67 ms per cycle</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">ALTERNATING CURRENT</text>
    <rect x="530" y="130" width="356" height="72" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <path d="M548 166 C566 122, 584 122, 602 166 C620 210, 638 210, 656 166 C674 122, 692 122, 710 166 C728 210, 746 210, 764 166" stroke="#EA580C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <text x="790" y="163" fill="#C2410C" font-size="13" font-weight="700">peaks at</text>
    <text x="790" y="180" fill="#C2410C" font-size="13" font-weight="700">169.7 V</text>

    <text x="530" y="234" fill="#94A3B8" font-size="11" font-weight="700">DIRECT CURRENT</text>
    <rect x="530" y="246" width="356" height="56" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <path d="M548 274 L764 274" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round"/>
    <text x="790" y="279" fill="#1D4ED8" font-size="13" font-weight="700">steady</text>

    <rect x="530" y="320" width="356" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="345" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">peak = RMS × 1.414</text>
    <text x="708" y="366" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the grid is AC because only AC transforms</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
