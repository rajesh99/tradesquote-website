<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="epuHeroTitle epuHeroDesc">
  <title id="epuHeroTitle">Panel upgrade for an EV charger</title>
  <desc id="epuHeroDesc">Abstract hero graphic with soft gradients showing that a 32 amp charger fits a 100 amp service at 95 amps while a 40 amp charger exceeds it by 5 amps, turning a 1,300 dollar job into a 4,240 dollar one.</desc>

  <defs>
    <linearGradient id="epuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="epuSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="epuTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="epuAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="epuBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#epuBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#epuSky)" filter="url(#epuBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#epuTeal)" filter="url(#epuBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="156" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Panel upgrade</tspan>
    <tspan x="80" dy="38" fill="#0284C7">for an EV charger?</tspan>
  </text>
  <text x="80" y="264" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Usually not — measure first</text>
  <rect x="80" y="288" width="56" height="4" rx="2" fill="url(#epuAccentBar)"/>
  <text x="80" y="336" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 220.87 · 625.42 · Article 750</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">100 A SERVICE, 44 A MEASURED PEAK</text>

    <rect x="530" y="134" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="155" fill="#94A3B8" font-size="10" font-weight="700">A 32 A CHARGER</text>
    <text x="550" y="176" fill="#15803D" font-size="15" font-weight="800">95.0 A — fits, 5.0 A spare</text>

    <rect x="530" y="196" width="356" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="217" fill="#94A3B8" font-size="10" font-weight="700">A 40 A CHARGER</text>
    <text x="550" y="238" fill="#B91C1C" font-size="15" font-weight="800">105.0 A — over by 5.0 A</text>

    <rect x="530" y="266" width="172" height="66" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#16A34A" stroke-width="2.4"/>
    <text x="616" y="290" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">CIRCUIT ONLY</text>
    <text x="616" y="316" text-anchor="middle" fill="#15803D" font-size="21" font-weight="800">$1,300</text>

    <rect x="714" y="266" width="172" height="66" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#DC2626" stroke-width="2.4"/>
    <text x="800" y="290" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">WITH UPGRADE</text>
    <text x="800" y="316" text-anchor="middle" fill="#B91C1C" font-size="21" font-weight="800">$4,240</text>

    <text x="530" y="364" fill="#94A3B8" font-size="11" font-weight="600">eight amps of charger, $2,940 of difference</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
