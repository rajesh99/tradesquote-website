<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="fuHeroTitle fuHeroDesc">
  <title id="fuHeroTitle">Fixture units explained</title>
  <desc id="fuHeroDesc">Hero graphic contrasting water supply fixture units with drainage fixture units for the same water closet, showing they measure different physical loads.</desc>

  <defs>
    <linearGradient id="fuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="fuOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="fuTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fuAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="fuBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#fuBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#fuOrange)" filter="url(#fuBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#fuTeal)" filter="url(#fuBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Fixture units</tspan>
    <tspan x="80" dy="40" fill="#EA580C">explained</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">WSFU and DFU are different numbers</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#fuAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">for the same fixture, on purpose</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">A WATER CLOSET ON SUPPLY</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="159" fill="#15803D" font-size="14" font-weight="700">2.2 WSFU — light, it fills slowly</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">THE SAME WATER CLOSET ON DRAINAGE</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">3 DFU — heavy, it dumps all at once</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">supply and drainage</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">are different questions</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">one measures probable draw, the other measures discharge</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">and demand per fixture unit falls as the building gets bigger, from 1.88 to 0.33 gpm</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
