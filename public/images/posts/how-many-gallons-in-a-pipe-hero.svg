<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gipHeroTitle gipHeroDesc">
  <title id="gipHeroTitle">How many gallons are in a pipe</title>
  <desc id="gipHeroDesc">Hero graphic showing the derivation of the gallons per foot formula from geometry and what it means for a typical hot water run.</desc>

  <defs>
    <linearGradient id="gipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="gipOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gipTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gipAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="gipBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gipBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#gipOrange)" filter="url(#gipBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#gipTeal)" filter="url(#gipBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How many gallons</tspan>
    <tspan x="80" dy="40" fill="#EA580C">are in a pipe?</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">0.0408 × diameter squared</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#gipAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">geometry, not a lookup table — and it checks out</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">THE DERIVATION</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="159" fill="#1D4ED8" font-size="14" font-weight="700">π/4 × d² × 12 ÷ 231 = 0.0408 d²</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">THE CROSS-CHECK</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="249" fill="#15803D" font-size="14" font-weight="700">1 inch Sch 40, 1.049 bore → 0.0449 gal/ft</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">50 ft of 3/4 copper</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">holds 1.26 gallons</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">which is 38 seconds of cold water before the hot arrives</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">every wait-time and purge-volume question is this formula wearing a hat</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
