<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="s1HeroTitle s1HeroDesc">
  <title id="s1HeroTitle">The solar 120% rule</title>
  <desc id="s1HeroDesc">Abstract hero graphic with soft gradients showing that a 200 amp panel with a 200 amp main allows exactly 40 amps of backfed solar breaker — 240 amps of devices on a 240 amp allowance, with zero headroom.</desc>

  <defs>
    <linearGradient id="s1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="s1Sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="s1Teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="s1AccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="s1Blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#s1Bg)"/>
  <ellipse cx="812" cy="132" rx="200" ry="160" fill="url(#s1Sun)" filter="url(#s1Blur)"/>
  <ellipse cx="646" cy="396" rx="180" ry="140" fill="url(#s1Teal)" filter="url(#s1Blur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">The solar</tspan>
    <tspan x="80" dy="42" fill="#D97706">120% rule</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Busbar math, and where the breaker goes</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#s1AccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 705.12(B)(3)(2)</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">A 200 A PANEL, 200 A MAIN</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="550" y="159" fill="#334155" font-size="14" font-weight="700">200 &#215; 120% = 240 A allowance</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">MINUS THE MAIN, WHAT IS LEFT</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#D97706" stroke-width="2.4"/>
    <text x="550" y="249" fill="#B45309" font-size="14" font-weight="700">40 A. A 7.6 kW inverter. Exactly.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">Opposite end of the busbar</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">not a formality — it is why 120% is allowed at all</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">a 175 A main derate buys 50% more solar for one breaker</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
