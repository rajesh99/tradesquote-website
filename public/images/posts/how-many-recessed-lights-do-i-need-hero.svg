<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="rlHeroTitle rlHeroDesc">
  <title id="rlHeroTitle">How many recessed lights do I need</title>
  <desc id="rlHeroDesc">Abstract hero graphic with soft gradients showing a four by three grid of recessed fixtures in a kitchen-sized room at four foot spacing.</desc>

  <defs>
    <linearGradient id="rlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="rlSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rlTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rlAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="rlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="rlBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#rlBg)"/>
  <ellipse cx="800" cy="140" rx="200" ry="160" fill="url(#rlSky)" filter="url(#rlBlur)"/>
  <ellipse cx="656" cy="392" rx="180" ry="140" fill="url(#rlTeal)" filter="url(#rlBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="164" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How many</tspan>
    <tspan x="80" dy="40" fill="#0284C7">recessed lights?</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Count and spacing, room by room</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#rlAccentBar)"/>
  <text x="80" y="356" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">spacing = ceiling height ÷ 2</text>

  <!-- 4 x 3 grid, to scale at 20 px per foot -->
  <g>
    <rect x="524" y="130" width="320" height="240" rx="6" fill="#FFFFFF" fill-opacity="0.7" stroke="#152035" stroke-width="2"/>

    <circle cx="564" cy="170" r="26" fill="url(#rlGlow)"/><circle cx="644" cy="170" r="26" fill="url(#rlGlow)"/><circle cx="724" cy="170" r="26" fill="url(#rlGlow)"/><circle cx="804" cy="170" r="26" fill="url(#rlGlow)"/>
    <circle cx="564" cy="250" r="26" fill="url(#rlGlow)"/><circle cx="644" cy="250" r="26" fill="url(#rlGlow)"/><circle cx="724" cy="250" r="26" fill="url(#rlGlow)"/><circle cx="804" cy="250" r="26" fill="url(#rlGlow)"/>
    <circle cx="564" cy="330" r="26" fill="url(#rlGlow)"/><circle cx="644" cy="330" r="26" fill="url(#rlGlow)"/><circle cx="724" cy="330" r="26" fill="url(#rlGlow)"/><circle cx="804" cy="330" r="26" fill="url(#rlGlow)"/>

    <circle cx="564" cy="170" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="644" cy="170" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="724" cy="170" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="804" cy="170" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/>
    <circle cx="564" cy="250" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="644" cy="250" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="724" cy="250" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="804" cy="250" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/>
    <circle cx="564" cy="330" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="644" cy="330" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="724" cy="330" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/><circle cx="804" cy="330" r="10" fill="#FFFFFF" stroke="#01AD9F" stroke-width="2.4"/>

    <text x="684" y="396" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">16 × 12 ft kitchen · 4 × 3 grid · 12 fixtures</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
