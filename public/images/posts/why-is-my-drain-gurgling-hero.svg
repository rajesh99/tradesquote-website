<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gurHeroTitle gurHeroDesc">
  <title id="gurHeroTitle">Why a drain gurgles</title>
  <desc id="gurHeroDesc">Hero graphic explaining that a gurgling drain is air being pulled through a trap seal because the vent is not doing its job.</desc>

  <defs>
    <linearGradient id="gurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="gurOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gurTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gurAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="gurBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gurBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#gurOrange)" filter="url(#gurBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#gurTeal)" filter="url(#gurBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Why is my</tspan>
    <tspan x="80" dy="40" fill="#EA580C">drain gurgling?</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">That sound is your trap seal leaving</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#gurAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">the noise is air taking the only route it can find</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">WHAT YOU HEAR</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="159" fill="#C2410C" font-size="14" font-weight="700">air dragged backwards through the trap</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">WHAT IT MEANS</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">the vent is blocked, too far, or absent</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">a gurgle is a warning</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">about sewer gas</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the seal that survives a gurgle may not survive the next one</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">a 2 inch trap arm past 8 ft is unvented no matter what it connects to</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
