<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="elHeroTitle elHeroDesc">
  <title id="elHeroTitle">NEC 220.87 existing load from measured demand</title>
  <desc id="elHeroDesc">Abstract hero graphic with soft gradients showing a 44 amp measured peak becoming a 55 amp existing load, leaving room for a 32 amp EV charger on a 100 amp service.</desc>

  <defs>
    <linearGradient id="elBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="elSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="elTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="elAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="elBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#elBg)"/>
  <ellipse cx="800" cy="138" rx="200" ry="160" fill="url(#elSky)" filter="url(#elBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#elTeal)" filter="url(#elBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">NEC</tspan>
    <tspan x="80" dy="42" fill="#0284C7">220.87</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Measure the load. Don't calculate it.</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#elAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">12 months of utility demand data × 125%</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">CALCULATED — NEC 220.82</text>
    <rect x="530" y="134" width="356" height="44" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="162" fill="#B91C1C" font-size="13" font-weight="700">101.2 A — needs a 125 A service</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">MEASURED — NEC 220.87</text>
    <rect x="530" y="220" width="356" height="44" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="248" fill="#15803D" font-size="13" font-weight="700">44 A peak × 1.25 = 55.0 A</text>

    <rect x="530" y="286" width="356" height="76" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="800">95.0 A of 100 A</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">with a 32 A charger added — 5.0 A to spare</text>

    <text x="530" y="392" fill="#94A3B8" font-size="11" font-weight="600">a 40 A charger misses by exactly 5.0 A</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
