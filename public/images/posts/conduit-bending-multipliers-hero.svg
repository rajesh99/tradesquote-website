<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="cbHeroTitle cbHeroDesc">
  <title id="cbHeroTitle">Conduit bending multipliers</title>
  <desc id="cbHeroDesc">Abstract hero graphic with soft gradients showing that the offset multiplier is the cosecant of the bend angle, so the printed table is five rounded trig values.</desc>

  <defs>
    <linearGradient id="cbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="cbSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cbTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cbAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cbBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#cbBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#cbSky)" filter="url(#cbBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#cbTeal)" filter="url(#cbBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Conduit</tspan>
    <tspan x="80" dy="42" fill="#0284C7">bending</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The table is one trig function</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#cbAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">offsets · saddles · stub-ups · the 360° limit</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">THE MULTIPLIER IS</text>
    <rect x="530" y="134" width="356" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="708" y="167" text-anchor="middle" fill="#2563EB" font-size="20" font-weight="800">csc θ  =  1 ÷ sin θ</text>

    <text x="530" y="216" fill="#94A3B8" font-size="11" font-weight="700">THE SHRINK IS</text>
    <rect x="530" y="228" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2"/>
    <text x="708" y="261" text-anchor="middle" fill="#15803D" font-size="20" font-weight="800">csc θ − cot θ</text>

    <rect x="530" y="300" width="356" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="326" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="800">30° → 2.000 · 45° → 1.414 · 60° → 1.155</text>
    <text x="708" y="348" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the printed 2, 1.4 and 1.2 are these, rounded</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">and no more than 360° between pull points</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
