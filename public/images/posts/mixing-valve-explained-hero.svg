<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="mveHeroTitle mveHeroDesc">
  <title id="mveHeroTitle">Thermostatic mixing valves explained</title>
  <desc id="mveHeroDesc">Hero graphic showing that a thermostatic mixing valve corrects on its outlet temperature and increases usable tank capacity as a side effect.</desc>

  <defs>
    <linearGradient id="mveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="mveOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mveTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="mveAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="mveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#mveBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#mveOrange)" filter="url(#mveBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#mveTeal)" filter="url(#mveBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Thermostatic</tspan>
    <tspan x="80" dy="40" fill="#EA580C">mixing valves</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">It corrects on the outlet, not the inlets</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#mveAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">which is why the shower survives a flushed toilet</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">A MANUAL TEMPERING VALVE</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="159" fill="#C2410C" font-size="14" font-weight="700">sets a fixed ratio and then drifts</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">A THERMOSTATIC VALVE</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="249" fill="#15803D" font-size="14" font-weight="700">measures the mix and moves the spool</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">and storing hot turns</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">50 gallons into 64</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a 1.286x multiplier — 81.8 gal if you deliver 105 °F</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">ASSE 1017 at the heater never replaces ASSE 1016 at the shower</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
