<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ecHeroTitle ecHeroDesc">
  <title id="ecHeroTitle">EV charger installation cost</title>
  <desc id="ecHeroDesc">Abstract hero graphic with soft gradients showing a typical EV charger installation total and how panel work multiplies it.</desc>

  <defs>
    <linearGradient id="ecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ecSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ecTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ecAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ecBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ecBg)"/>
  <ellipse cx="796" cy="134" rx="200" ry="160" fill="url(#ecSky)" filter="url(#ecBlur)"/>
  <ellipse cx="660" cy="392" rx="180" ry="140" fill="url(#ecTeal)" filter="url(#ecBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="172" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">EV charger</tspan>
    <tspan x="80" dy="42" fill="#0284C7">installation cost</tspan>
  </text>
  <text x="80" y="284" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">What drives the $500–$2,500 range</text>
  <rect x="80" y="308" width="56" height="4" rx="2" fill="url(#ecAccentBar)"/>

  <!-- Typical vs upgrade -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="530" y="128" width="356" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="166" text-anchor="middle" fill="#0F766E" font-size="30" font-weight="800">$1,300</text>
    <text x="708" y="190" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">48 A, 40 ft surface run, breaker fitted</text>

    <rect x="530" y="222" width="356" height="30" rx="15" fill="#F0FDFA" fill-opacity="0.9" stroke="#5EEAD4" stroke-width="1.6"/>
    <text x="708" y="242" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="700">typical band $1,105 – $1,495</text>

    <path d="M708 264 L 708 288" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <rect x="530" y="296" width="356" height="70" rx="12" fill="#FEF2F2" fill-opacity="0.95" stroke="#DC2626" stroke-width="2.4"/>
    <text x="708" y="328" text-anchor="middle" fill="#DC2626" font-size="26" font-weight="800">$4,240</text>
    <text x="708" y="352" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="500">the same job, with a service upgrade</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
