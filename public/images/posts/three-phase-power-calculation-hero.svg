<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="tpHeroTitle tpHeroDesc">
  <title id="tpHeroTitle">Three-phase power calculation</title>
  <desc id="tpHeroDesc">Abstract hero graphic with soft gradients showing three phasors 120 degrees apart and the result that three-phase carries the same power at 57.7 percent of the single-phase current.</desc>

  <defs>
    <linearGradient id="tpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="tpSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tpTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tpAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="tpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#tpBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#tpSky)" filter="url(#tpBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#tpTeal)" filter="url(#tpBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Three-phase</tspan>
    <tspan x="80" dy="42" fill="#0284C7">power</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Where the √3 comes from</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#tpAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">P = √3 × V × I × PF</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- three phasors 120 apart -->
    <g transform="translate(660,196)">
      <circle cx="0" cy="0" r="76" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#DC2626" stroke-width="4"/>
      <line x1="0" y1="0" x2="-36" y2="62.35" stroke="#16A34A" stroke-width="4"/>
      <line x1="0" y1="0" x2="-36" y2="-62.35" stroke="#2563EB" stroke-width="4"/>
      <circle cx="0" cy="0" r="4" fill="#152035"/>
      <text x="80" y="4" fill="#DC2626" font-size="12" font-weight="800">A</text>
      <text x="-52" y="80" fill="#16A34A" font-size="12" font-weight="800">B</text>
      <text x="-52" y="-68" fill="#2563EB" font-size="12" font-weight="800">C</text>
      <text x="16" y="-24" fill="#94A3B8" font-size="10" font-weight="600">120°</text>
    </g>

    <rect x="530" y="300" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="708" y="329" text-anchor="middle" fill="#2563EB" font-size="14" font-weight="700">120 V × √3 = 207.85 V line-to-line</text>

    <rect x="530" y="356" width="356" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="380" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="800">same power, 57.7% of the current</text>
    <text x="708" y="400" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">which is exactly 1 ÷ √3</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
