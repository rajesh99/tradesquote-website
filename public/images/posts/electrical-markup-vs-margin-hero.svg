<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="mmHeroTitle mmHeroDesc">
  <title id="mmHeroTitle">Markup vs margin for electrical contractors</title>
  <desc id="mmHeroDesc">Abstract hero graphic with soft gradients showing that a 25 percent markup is only a 20 percent margin, costing $248 of profit on an identical job.</desc>

  <defs>
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="mmRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mmTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="mmAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="mmBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#mmBg)"/>
  <ellipse cx="808" cy="136" rx="200" ry="160" fill="url(#mmRose)" filter="url(#mmBlur)"/>
  <ellipse cx="650" cy="394" rx="180" ry="140" fill="url(#mmTeal)" filter="url(#mmBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Markup</tspan>
    <tspan x="80" dy="42" fill="#E11D48">vs margin</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Same percentage. Different money.</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#mmAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">price = cost &#247; (1 &#8722; margin)</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">A 25% MARGIN ON A $2,979 JOB</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="159" fill="#15803D" font-size="14" font-weight="700">$3,971 &#8212; and $993 of profit</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">A 25% MARKUP ON THE SAME JOB</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">$3,723 &#8212; and only $745</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">$248 gone, same work</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a 25% markup is always exactly a 20% margin</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">markup measures against cost; margin against price</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
