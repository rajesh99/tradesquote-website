<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="gbHeroTitle gbHeroDesc">
  <title id="gbHeroTitle">Grounding vs bonding</title>
  <desc id="gbHeroDesc">Abstract hero graphic with soft gradients showing that a 25 ohm earth connection passes only 4.8 amps at 120 volts, far too little to trip a breaker, so bonding clears faults and grounding does not.</desc>

  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="gbSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gbTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gbAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="gbBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#gbBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#gbSky)" filter="url(#gbBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#gbTeal)" filter="url(#gbBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Grounding vs</tspan>
    <tspan x="80" dy="42" fill="#0284C7">bonding</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Earth does not clear faults</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#gbAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 250.4(A) · the effective path</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">A FAULT THROUGH A 25 Ω GROUND ROD</text>
    <rect x="530" y="134" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="163" fill="#B91C1C" font-size="14" font-weight="700">120 V ÷ 25 Ω = 4.8 A</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">TO CLEAR A 20 A BREAKER FAST</text>
    <rect x="530" y="224" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="253" fill="#15803D" font-size="14" font-weight="700">you need on the order of 100 A</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">the bonded path clears it</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">250.4(A)(5): earth shall not be the fault path</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">electrodes handle surges, not short circuits</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
