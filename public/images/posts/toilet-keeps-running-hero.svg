<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="toiletRunningHeroTitle toiletRunningHeroDesc">
  <title id="toiletRunningHeroTitle">Toilet keeps running: what it costs and how to find the cause</title>
  <desc id="toiletRunningHeroDesc">A visibly running toilet wastes 1,000 gallons a day and costs about 4,563 dollars a year, while a silent flapper leak costs 913. A dye test in the tank tells the two failures apart.</desc>

  <defs>
    <linearGradient id="toiletRunningBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="toiletRunningOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="toiletRunningTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="toiletRunningAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="toiletRunningBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#toiletRunningBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#toiletRunningOrange)" filter="url(#toiletRunningBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#toiletRunningTeal)" filter="url(#toiletRunningBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Toilet keeps</tspan>
    <tspan x="80" dy="40" fill="#EA580C">running</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The most expensive thing in a house</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#toiletRunningAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">that nobody treats as an emergency</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">VISIBLY RUNNING</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="159" fill="#B91C1C" font-size="14" font-weight="700">1,000 gal/day  ·  $4,563 a year</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">SILENT FLAPPER LEAK</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="249" fill="#C2410C" font-size="14" font-weight="700">200 gal/day  ·  $913 a year</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">175x the dripping tap</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">$12.50 every day</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">and the silent one makes no sound at all</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">Dye the tank, wait 20 minutes: colour in the bowl is the flapper</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
