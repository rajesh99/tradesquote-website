<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="sumpPumpHeroTitle sumpPumpHeroDesc">
  <title id="sumpPumpHeroTitle">What size sump pump do I need: total dynamic head and flow</title>
  <desc id="sumpPumpHeroDesc">Thirty gallons a minute up twelve feet through forty feet of inch-and-a-half PVC is 14.4 feet of total dynamic head, of which twelve is the lift. Reducing to one inch takes it to 30.7.</desc>

  <defs>
    <linearGradient id="sumpPumpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="sumpPumpOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sumpPumpTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sumpPumpAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="sumpPumpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#sumpPumpBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#sumpPumpOrange)" filter="url(#sumpPumpBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#sumpPumpTeal)" filter="url(#sumpPumpBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">What size sump</tspan>
    <tspan x="80" dy="40" fill="#EA580C">pump do I need?</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Head first. Horsepower second.</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#sumpPumpAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">The lift is over 80% of the answer</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">30 GPM, 12 ft LIFT, 1-1/2in</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="159" fill="#15803D" font-size="14" font-weight="700">TDH 14.4 ft  ·  lift is 12 of it</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">SAME JOB, REDUCED TO 1in</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">TDH 30.7 ft  ·  2.1x the head</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">Never reduce below</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">the pump's own outlet</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">you paid for a pump and threw away half of it</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">Read the curve at your head, not the flow on the box</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
