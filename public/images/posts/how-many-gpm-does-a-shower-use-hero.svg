<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="showerFlowHeroTitle showerFlowHeroDesc">
  <title id="showerFlowHeroTitle">How many gallons per minute does a shower use, and how much is hot</title>
  <desc id="showerFlowHeroDesc">The federal maximum is 2.5 gallons a minute, so a ten-minute shower is 25 gallons. Only 1.528 gallons a minute of it is hot, which is already twice what a 40,000 BTU heater can make.</desc>

  <defs>
    <linearGradient id="showerFlowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="showerFlowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="showerFlowTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="showerFlowAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="showerFlowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#showerFlowBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#showerFlowOrange)" filter="url(#showerFlowBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#showerFlowTeal)" filter="url(#showerFlowBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How many gpm</tspan>
    <tspan x="80" dy="40" fill="#EA580C">does a shower use?</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">2.5 gpm is the federal maximum</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#showerFlowAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">but only 61% of it is hot water</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">10-MINUTE SHOWER</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="159" fill="#1D4ED8" font-size="14" font-weight="700">25.0 gallons  ·  1.528 gpm hot</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">40,000 BTU HEATER MAKES</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="249" fill="#B91C1C" font-size="14" font-weight="700">0.711 gpm of hot water</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">One shower is already</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">2.1x the burner</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">stored volume covers the gap, which is why they end</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">Cold inlet moves it: 65% hot at 40F in, 50% at 70F in</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
