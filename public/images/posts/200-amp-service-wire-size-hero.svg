<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="svcHeroTitle svcHeroDesc">
  <title id="svcHeroTitle">200 amp service wire size</title>
  <desc id="svcHeroDesc">Abstract hero graphic with soft gradients showing a meter and service panel with the 83 percent allowance and the resulting copper and aluminum conductor sizes.</desc>

  <defs>
    <linearGradient id="svcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="svcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="svcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="svcCond" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="svcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="svcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#svcBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#svcSky)" filter="url(#svcBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#svcTeal)" filter="url(#svcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="190" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">200 amp service</tspan>
    <tspan x="80" dy="48" fill="#0284C7">wire size</tspan>
  </text>
  <text x="80" y="292" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">And the 83% rule behind it</text>
  <rect x="80" y="316" width="56" height="4" rx="2" fill="url(#svcAccentBar)"/>

  <!-- Meter -->
  <circle cx="566" cy="180" r="34" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="2.5"/>
  <circle cx="566" cy="180" r="20" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="566" y="185" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">kWh</text>

  <!-- Service conductors -->
  <rect x="600" y="164" width="180" height="12" rx="6" fill="url(#svcCond)"/>
  <rect x="600" y="184" width="180" height="12" rx="6" fill="url(#svcCond)"/>
  <rect x="600" y="204" width="180" height="9" rx="4.5" fill="#94A3B8" opacity="0.65"/>

  <!-- Panel -->
  <rect x="780" y="130" width="80" height="150" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#5EEAD4" stroke-width="2.5"/>
  <rect x="794" y="146" width="52" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="820" y="161" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">200A</text>
  <rect x="794" y="178" width="24" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="822" y="178" width="24" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="794" y="192" width="24" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="822" y="192" width="24" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="794" y="206" width="24" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="822" y="206" width="24" height="8" rx="2" fill="#CBD5E1"/>

  <!-- 83% badge -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="566" y="242" width="164" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="648" y="263" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800" letter-spacing="0.5">200 × 0.83 = 166 A</text>
  </g>

  <!-- Resulting sizes -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="316" width="176" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#01AD9F" stroke-width="2"/>
    <text x="542" y="342" fill="#0F766E" font-size="20" font-weight="800">2/0 Cu</text>
    <text x="542" y="362" fill="#64748B" font-size="10.5" font-weight="500">copper service</text>

    <rect x="716" y="316" width="176" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#93C5FD" stroke-width="2"/>
    <text x="734" y="342" fill="#2563EB" font-size="20" font-weight="800">4/0 Al</text>
    <text x="734" y="362" fill="#64748B" font-size="10.5" font-weight="500">the common choice</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
