<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="pfHeroTitle pfHeroDesc">
  <title id="pfHeroTitle">Power factor correction</title>
  <desc id="pfHeroDesc">Abstract hero graphic with soft gradients showing that correcting 80 kilowatts from 0.8 to 0.95 power factor needs 33.7 kVAR and cuts line current by 15.8 percent.</desc>

  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="pfSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pfTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pfAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="pfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#pfBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#pfSky)" filter="url(#pfBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#pfTeal)" filter="url(#pfBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Power factor</tspan>
    <tspan x="80" dy="40" fill="#0284C7">correction</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">kVAR = kW × (tan θ₁ − tan θ₂)</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#pfAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">80 kW · from 0.80 to 0.95</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">CAPACITOR REQUIRED</text>
    <rect x="530" y="134" width="356" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="550" y="167" fill="#2563EB" font-size="19" font-weight="800">33.7 kVAR</text>

    <text x="530" y="216" fill="#94A3B8" font-size="11" font-weight="700">LINE CURRENT AND BILLED DEMAND</text>
    <rect x="530" y="228" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="261" fill="#15803D" font-size="19" font-weight="800">−15.8%</text>
    <text x="700" y="261" fill="#94A3B8" font-size="12" font-weight="600">100 → 84.2 kVA</text>

    <rect x="530" y="300" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="328" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">I²R losses fall 29.1%</text>
    <text x="708" y="350" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">because losses follow the square of current</text>

    <text x="530" y="392" fill="#94A3B8" font-size="11" font-weight="600">capacitors fix lagging PF — not harmonic distortion</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
