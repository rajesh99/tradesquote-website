<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="bfHeroTitle bfHeroDesc">
  <title id="bfHeroTitle">Box fill calculation</title>
  <desc id="bfHeroDesc">Abstract hero graphic with soft gradients showing a device box with cables entering and a running total of volume allowances in cubic inches.</desc>

  <defs>
    <linearGradient id="bfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="bfSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bfTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bfAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="bfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bfBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#bfSky)" filter="url(#bfBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#bfTeal)" filter="url(#bfBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="39" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Box fill</tspan>
    <tspan x="80" dy="48" fill="#0284C7">calculation</tspan>
  </text>
  <text x="80" y="296" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Counting conductors per NEC 314.16</text>
  <rect x="80" y="320" width="56" height="4" rx="2" fill="url(#bfAccentBar)"/>

  <!-- Device box -->
  <rect x="536" y="140" width="170" height="210" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#0284C7" stroke-width="2.6"/>
  <rect x="556" y="168" width="130" height="60" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.4"/>
  <circle cx="600" cy="190" r="6" fill="#94A3B8"/>
  <circle cx="600" cy="206" r="6" fill="#94A3B8"/>
  <rect x="636" y="182" width="30" height="34" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Cables entering -->
  <path d="M500 190 L 536 190" stroke="#152035" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M500 300 L 536 300" stroke="#152035" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <text x="470" y="182" text-anchor="end" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">12/2 in</text>
  <text x="470" y="292" text-anchor="end" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">12/2 out</text>

  <!-- Running tally -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
    <text x="736" y="176" fill="#64748B">4 conductors</text>
    <text x="884" y="176" text-anchor="end" fill="#0369A1" font-weight="800">9.00</text>
    <text x="736" y="204" fill="#64748B">grounds ×1</text>
    <text x="884" y="204" text-anchor="end" fill="#0369A1" font-weight="800">2.25</text>
    <text x="736" y="232" fill="#64748B">clamps ×1</text>
    <text x="884" y="232" text-anchor="end" fill="#0369A1" font-weight="800">2.25</text>
    <text x="736" y="260" fill="#64748B">device ×2</text>
    <text x="884" y="260" text-anchor="end" fill="#0369A1" font-weight="800">4.50</text>
    <line x1="736" y1="274" x2="884" y2="274" stroke="#152035" stroke-width="1.2"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="722" y="288" width="176" height="62" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="810" y="316" text-anchor="middle" fill="#0F766E" font-size="23" font-weight="800">18.00 in³</text>
    <text x="810" y="336" text-anchor="middle" fill="#64748B" font-size="10" font-weight="500">minimum box volume</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
