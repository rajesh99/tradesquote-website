<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="mcHeroTitle mcHeroDesc">
  <title id="mcHeroTitle">Motor circuit sizing</title>
  <desc id="mcHeroDesc">Abstract hero graphic with soft gradients showing a 35 amp breaker legally protecting a 14 AWG conductor rated 20 amps, because the overload device protects the conductor instead.</desc>

  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="mcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="mcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="mcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#mcBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#mcSky)" filter="url(#mcBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#mcTeal)" filter="url(#mcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Motor circuit</tspan>
    <tspan x="80" dy="42" fill="#0284C7">sizing</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The breaker isn't protecting the wire</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#mcAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 240.4(G) · 430.52 · 430.32</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">10 HP, 3φ 460 V, DESIGN B</text>

    <rect x="530" y="134" width="172" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="616" y="155" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">CONDUCTOR</text>
    <text x="616" y="176" text-anchor="middle" fill="#2563EB" font-size="16" font-weight="800">14 AWG · 20 A</text>

    <rect x="714" y="134" width="172" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="800" y="155" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">BREAKER</text>
    <text x="800" y="176" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="800">35 A</text>

    <rect x="530" y="204" width="356" height="52" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="225" fill="#94A3B8" font-size="10" font-weight="700">WHAT ACTUALLY PROTECTS THE CONDUCTOR</text>
    <text x="550" y="246" fill="#15803D" font-size="15" font-weight="800">the overload, set at 16.25 A</text>

    <rect x="530" y="276" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="306" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="800">1.75× its ampacity</text>
    <text x="708" y="330" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">legal, because 240.4(G) sends you to Article 430</text>

    <text x="530" y="374" fill="#94A3B8" font-size="11" font-weight="600">the breaker is there for short circuits and inrush</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
