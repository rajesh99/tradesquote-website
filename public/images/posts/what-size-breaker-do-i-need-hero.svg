<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="bkHeroTitle bkHeroDesc">
  <title id="bkHeroTitle">What size breaker do I need</title>
  <desc id="bkHeroDesc">Abstract hero graphic with soft gradients showing a row of circuit breakers in a panel with the load-to-breaker sizing steps called out.</desc>

  <defs>
    <linearGradient id="bkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="bkSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bkTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bkAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="bkBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="bkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bkBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#bkSky)" filter="url(#bkBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#bkTeal)" filter="url(#bkBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="192" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="39" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">What size breaker</tspan>
    <tspan x="80" dy="48" fill="#0284C7">do I need?</tspan>
  </text>
  <text x="80" y="294" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Sizing OCPD by load — and by wire</text>
  <rect x="80" y="318" width="56" height="4" rx="2" fill="url(#bkAccentBar)"/>

  <!-- Panel with breakers -->
  <rect x="536" y="112" width="352" height="212" rx="16" fill="#FFFFFF" fill-opacity="0.72" stroke="#7DD3FC" stroke-width="2"/>
  <rect x="700" y="128" width="24" height="180" rx="4" fill="#CBD5E1" opacity="0.55"/>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">
    <rect x="556" y="136" width="132" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <text x="570" y="154" fill="#0369A1">15 A</text>
    <rect x="556" y="170" width="132" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <text x="570" y="188" fill="#0369A1">20 A</text>
    <rect x="556" y="204" width="132" height="26" rx="5" fill="#CCFBF1" stroke="#01AD9F" stroke-width="2.2" filter="url(#bkGlow)"/>
    <text x="570" y="222" fill="#0F766E">30 A</text>
    <rect x="556" y="238" width="132" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <text x="570" y="256" fill="#0369A1">50 A</text>
    <rect x="556" y="272" width="132" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <text x="570" y="290" fill="#0369A1">60 A</text>

    <rect x="736" y="136" width="132" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="750" y="154" fill="#64748B">14 AWG</text>
    <rect x="736" y="170" width="132" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="750" y="188" fill="#64748B">12 AWG</text>
    <rect x="736" y="204" width="132" height="26" rx="5" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6"/>
    <text x="750" y="222" fill="#0F766E">10 AWG</text>
    <rect x="736" y="238" width="132" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="750" y="256" fill="#64748B">8 AWG</text>
    <rect x="736" y="272" width="132" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="750" y="290" fill="#64748B">6 AWG</text>
  </g>

  <!-- 125% badge -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="536" y="346" width="200" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="636" y="367" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800" letter-spacing="0.5">× 1.25 if continuous</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
