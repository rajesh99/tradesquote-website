<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ccHeroTitle ccHeroDesc">
  <title id="ccHeroTitle">How to calculate conduit fill</title>
  <desc id="ccHeroDesc">Abstract hero graphic with soft gradients showing conductor areas being summed against a raceway area and a fill percentage result.</desc>

  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ccSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ccTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ccAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ccBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ccBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#ccSky)" filter="url(#ccBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#ccTeal)" filter="url(#ccBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="180" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How to calculate</tspan>
    <tspan x="80" dy="44" fill="#0284C7">conduit fill</tspan>
  </text>
  <text x="80" y="286" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Chapter 9, Tables 1, 4 and 5</text>
  <rect x="80" y="310" width="56" height="4" rx="2" fill="url(#ccAccentBar)"/>

  <!-- Sum of conductor areas -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="132" width="360" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="540" y="150" fill="#0369A1" font-size="11" font-weight="700">3 × 3 AWG THHN</text>
    <text x="868" y="150" text-anchor="end" fill="#64748B" font-size="10.5">0.2919</text>

    <rect x="524" y="164" width="360" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="540" y="182" fill="#0369A1" font-size="11" font-weight="700">1 × 8 AWG EGC</text>
    <text x="868" y="182" text-anchor="end" fill="#64748B" font-size="10.5">0.0366</text>

    <line x1="524" y1="200" x2="884" y2="200" stroke="#152035" stroke-width="1.2"/>
    <text x="540" y="220" fill="#152035" font-size="12" font-weight="800">total conductor area</text>
    <text x="868" y="220" text-anchor="end" fill="#152035" font-size="13" font-weight="800">0.3285 in²</text>

    <!-- Raceway -->
    <rect x="524" y="240" width="360" height="26" rx="6" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.4"/>
    <text x="540" y="258" fill="#0F766E" font-size="11" font-weight="700">1" EMT × 40%</text>
    <text x="868" y="258" text-anchor="end" fill="#0F766E" font-size="10.5" font-weight="600">0.3456 allowed</text>

    <!-- Result -->
    <rect x="596" y="300" width="216" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="704" y="330" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">38.0% fill</text>
    <text x="704" y="352" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="500">inside the 40% limit</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
