<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="svcCmpHeroTitle svcCmpHeroDesc">
  <title id="svcCmpHeroTitle">100 amp vs 200 amp service</title>
  <desc id="svcCmpHeroDesc">Abstract hero graphic with soft gradients comparing a 100 amp and a 200 amp service panel, with capacity in kilovolt-amperes shown for each.</desc>

  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="scSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="scTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="scAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="scBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#scBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#scSky)" filter="url(#scBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#scTeal)" filter="url(#scBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="188" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">100 amp vs</tspan>
    <tspan x="80" dy="48" fill="#0284C7">200 amp service</tspan>
  </text>
  <text x="80" y="290" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">What your home actually needs</text>
  <rect x="80" y="314" width="56" height="4" rx="2" fill="url(#scAccentBar)"/>

  <!-- 100 A panel -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="528" y="140" width="150" height="200" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#93C5FD" stroke-width="2"/>
    <rect x="548" y="160" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="603" y="178" text-anchor="middle" fill="#2563EB" font-size="12" font-weight="800">100 A</text>
    <rect x="548" y="198" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="610" y="198" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="548" y="214" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="610" y="214" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="548" y="230" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="610" y="230" width="48" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="548" y="246" width="48" height="9" rx="2" fill="#E2E8F0"/>
    <rect x="610" y="246" width="48" height="9" rx="2" fill="#E2E8F0"/>
    <text x="603" y="292" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="800">24 kVA</text>
    <text x="603" y="316" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="500">gas heat, no EV</text>
  </g>

  <!-- 200 A panel -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="712" y="118" width="176" height="244" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#5EEAD4" stroke-width="2.6"/>
    <rect x="734" y="138" width="132" height="28" rx="5" fill="#F0FDFA" stroke="#01AD9F" stroke-width="2"/>
    <text x="800" y="157" text-anchor="middle" fill="#0F766E" font-size="13" font-weight="800">200 A</text>
    <rect x="734" y="180" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="808" y="180" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="734" y="196" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="808" y="196" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="734" y="212" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="808" y="212" width="58" height="9" rx="2" fill="#94A3B8"/>
    <rect x="734" y="228" width="58" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="808" y="228" width="58" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="734" y="244" width="58" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="808" y="244" width="58" height="9" rx="2" fill="#CBD5E1"/>
    <rect x="734" y="260" width="58" height="9" rx="2" fill="#E2E8F0"/>
    <rect x="808" y="260" width="58" height="9" rx="2" fill="#E2E8F0"/>
    <text x="800" y="306" text-anchor="middle" fill="#0F766E" font-size="26" font-weight="800">48 kVA</text>
    <text x="800" y="332" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="500">all-electric + EV headroom</text>
  </g>

  <!-- Note -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="528" y="382" width="360" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.94" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="708" y="404" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800" letter-spacing="0.3">A load calculation decides — not a rule of thumb</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
