<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ctHeroTitle ctHeroDesc">
  <title id="ctHeroTitle">THHN vs NM-B vs MC cable</title>
  <desc id="ctHeroDesc">Abstract hero graphic with soft gradients showing that NM cable uses the 60 degree ampacity column while MC cable and THHN in conduit use the 75 degree column, and all three derate from 90 degrees.</desc>

  <defs>
    <linearGradient id="ctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ctSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ctTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ctAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ctBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ctBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#ctSky)" filter="url(#ctBlur)"/>
  <ellipse cx="654" cy="392" rx="180" ry="140" fill="url(#ctTeal)" filter="url(#ctBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">THHN, NM-B</tspan>
    <tspan x="80" dy="40" fill="#0284C7">or MC?</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The wiring method sets the column</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#ctAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 334.80 · 330.80 · Table 310.16</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="120" fill="#94A3B8" font-size="11" font-weight="700">AMPACITY COLUMN</text>

    <rect x="530" y="132" width="356" height="42" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="550" y="158" fill="#B91C1C" font-size="13" font-weight="700">NM-B (Romex)</text>
    <text x="866" y="158" text-anchor="end" fill="#B91C1C" font-size="15" font-weight="800">60 °C</text>

    <rect x="530" y="182" width="356" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="208" fill="#2563EB" font-size="13" font-weight="700">MC cable</text>
    <text x="866" y="208" text-anchor="end" fill="#2563EB" font-size="15" font-weight="800">75 °C</text>

    <rect x="530" y="232" width="356" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="258" fill="#2563EB" font-size="13" font-weight="700">THHN in conduit</text>
    <text x="866" y="258" text-anchor="end" fill="#2563EB" font-size="15" font-weight="800">75 °C</text>

    <rect x="530" y="292" width="356" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">6/3 Romex on 60 A: violation</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">6 AWG is only 55 A at 60 °C — it needs 4 AWG NM</text>

    <text x="530" y="386" fill="#94A3B8" font-size="11" font-weight="600">all three may still derate from the 90 °C column</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
