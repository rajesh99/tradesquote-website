<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="dfHeroTitle dfHeroDesc">
  <title id="dfHeroTitle">Range and dryer demand factors</title>
  <desc id="dfHeroDesc">Abstract hero graphic with soft gradients showing that a 12 kilowatt range counts as 8 kilowatts in a load calculation, because Table 220.55 Column C is a demand in kilowatts rather than a percentage.</desc>

  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="dfViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="dfTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="dfAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="dfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#dfBg)"/>
  <ellipse cx="808" cy="136" rx="200" ry="160" fill="url(#dfViolet)" filter="url(#dfBlur)"/>
  <ellipse cx="650" cy="394" rx="180" ry="140" fill="url(#dfTeal)" filter="url(#dfBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Range &amp; dryer</tspan>
    <tspan x="80" dy="42" fill="#7C3AED">demand factors</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The most misread table in Article 220</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#dfAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC Table 220.55 &#183; Table 220.54</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">WHAT THE NAMEPLATE SAYS</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="550" y="159" fill="#334155" font-size="14" font-weight="700">12 kW electric range</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">WHAT THE CALCULATION COUNTS</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.4"/>
    <text x="550" y="249" fill="#6D28D9" font-size="14" font-weight="700">8 kW. Flat. Not 80% &#8212; 8 kW.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">Column C is kilowatts</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a 9 kW range and a 12 kW range are the same load</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">and every dryer has a 5,000 VA floor, however small</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
