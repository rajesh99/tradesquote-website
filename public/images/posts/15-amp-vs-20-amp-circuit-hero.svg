<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="fvHeroTitle fvHeroDesc">
  <title id="fvHeroTitle">15 amp vs 20 amp circuit</title>
  <desc id="fvHeroDesc">Abstract hero graphic with soft gradients comparing a 15 amp circuit on 14 AWG against a 20 amp circuit on 12 AWG, shown as two conductors of different thickness.</desc>

  <defs>
    <linearGradient id="fvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="fvSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="fvTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fvWireA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fvWireB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="fvAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="fvBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#fvBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#fvSky)" filter="url(#fvBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#fvTeal)" filter="url(#fvBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">15 amp vs</tspan>
    <tspan x="80" dy="50" fill="#0284C7">20 amp circuit</tspan>
  </text>
  <text x="80" y="298" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Wire, outlets, and when to use each</text>
  <rect x="80" y="322" width="56" height="4" rx="2" fill="url(#fvAccentBar)"/>

  <!-- 15 A row -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="140" width="60" height="34" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="554" y="163" text-anchor="middle" fill="#2563EB" font-size="13" font-weight="800">15 A</text>
    <rect x="596" y="152" width="240" height="11" rx="5.5" fill="url(#fvWireA)"/>
    <text x="852" y="162" fill="#2563EB" font-size="13" font-weight="800">14 AWG</text>
    <text x="596" y="188" fill="#94A3B8" font-size="11" font-weight="500">4,110 cmil · 12 A continuous · 38 ft reach</text>
  </g>

  <!-- 20 A row -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="232" width="60" height="34" rx="7" fill="#F0FDFA" stroke="#01AD9F" stroke-width="2.2"/>
    <text x="554" y="255" text-anchor="middle" fill="#0F766E" font-size="13" font-weight="800">20 A</text>
    <rect x="596" y="240" width="240" height="18" rx="9" fill="url(#fvWireB)"/>
    <text x="852" y="254" fill="#0F766E" font-size="13" font-weight="800">12 AWG</text>
    <text x="596" y="282" fill="#94A3B8" font-size="11" font-weight="500">6,530 cmil · 16 A continuous · 45 ft reach</text>
  </g>

  <!-- Key note -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="330" width="376" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="546" y="352" fill="#0F766E" font-size="12" font-weight="800">A bigger breaker alone doesn't make a 20 A circuit</text>
    <text x="546" y="371" fill="#64748B" font-size="10.5" font-weight="500">14 AWG stays capped at 15 A — 240.4(D)</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
