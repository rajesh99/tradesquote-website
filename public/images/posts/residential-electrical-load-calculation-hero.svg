<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="lcHeroTitle lcHeroDesc">
  <title id="lcHeroTitle">Residential electrical load calculation</title>
  <desc id="lcHeroDesc">Abstract hero graphic with soft gradients showing a load calculation worksheet reducing a connected load to a calculated demand in amps.</desc>

  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="lcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lcFunnel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#01AD9F" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="lcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="lcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#lcBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#lcSky)" filter="url(#lcBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#lcTeal)" filter="url(#lcBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="182" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Residential load</tspan>
    <tspan x="80" dy="44" fill="#0284C7">calculation</tspan>
  </text>
  <text x="80" y="286" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">NEC 220.82, step by step</text>
  <rect x="80" y="310" width="56" height="4" rx="2" fill="url(#lcAccentBar)"/>

  <!-- Connected load bars narrowing to a result -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="520" y="130" width="330" height="22" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="534" y="146" fill="#0369A1" font-size="11" font-weight="700">general lighting</text>
    <text x="838" y="146" text-anchor="end" fill="#64748B" font-size="10.5">6,000</text>

    <rect x="520" y="160" width="330" height="22" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="534" y="176" fill="#0369A1" font-size="11" font-weight="700">appliances</text>
    <text x="838" y="176" text-anchor="end" fill="#64748B" font-size="10.5">22,700</text>

    <rect x="520" y="190" width="330" height="22" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="534" y="206" fill="#0369A1" font-size="11" font-weight="700">circuits</text>
    <text x="838" y="206" text-anchor="end" fill="#64748B" font-size="10.5">4,500</text>

    <text x="520" y="238" fill="#94A3B8" font-size="11" font-weight="600">33,200 VA connected</text>

    <!-- demand factor funnel -->
    <path d="M520 252 L 850 252 L 748 300 L 622 300 Z" fill="url(#lcFunnel)" opacity="0.5"/>
    <text x="685" y="282" text-anchor="middle" fill="#0F766E" font-size="11" font-weight="800">first 10 kVA 100% · rest 40%</text>

    <rect x="588" y="316" width="194" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.4"/>
    <text x="685" y="344" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">101.2 A</text>
    <text x="685" y="364" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="500">24,280 VA calculated</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
