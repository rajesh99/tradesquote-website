<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="whtHeroTitle whtHeroDesc">
  <title id="whtHeroTitle">Water heater temperature setting</title>
  <desc id="whtHeroDesc">Hero graphic showing that storing water at a hundred and forty degrees and mixing down to a hundred and twenty both controls bacteria and increases usable capacity.</desc>

  <defs>
    <linearGradient id="whtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="whtOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="whtTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="whtAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="whtBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#whtBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#whtOrange)" filter="url(#whtBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#whtTeal)" filter="url(#whtBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="158" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Water heater</tspan>
    <tspan x="80" dy="40" fill="#EA580C">temperature</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Store at 140, deliver at 120</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#whtAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">the two numbers solve two different problems</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">STORE AT 140 °F</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="550" y="159" fill="#C2410C" font-size="14" font-weight="700">hot enough that Legionella cannot establish</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">DELIVER AT 120 °F</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="249" fill="#15803D" font-size="14" font-weight="700">cool enough not to scald in seconds</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="315" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">and storing hot makes</text>
    <text x="708" y="337" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">a 50 gal tank act like 64</text>
    <text x="708" y="355" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a 1.29x multiplier for a valve that costs very little</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">one setting cannot do both jobs — which is what the mixing valve is for</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
