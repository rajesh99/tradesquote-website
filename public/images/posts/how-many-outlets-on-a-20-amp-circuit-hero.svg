<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="otHeroTitle otHeroDesc">
  <title id="otHeroTitle">How many outlets on a 20 amp circuit</title>
  <desc id="otHeroDesc">Abstract hero graphic with soft gradients showing a row of receptacles daisy-chained along a branch circuit, with the dwelling and commercial answers called out.</desc>

  <defs>
    <linearGradient id="otBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="otSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="otTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="otAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="otBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#otBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#otSky)" filter="url(#otBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#otTeal)" filter="url(#otBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="180" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">How many outlets</tspan>
    <tspan x="80" dy="44">on a</tspan>
    <tspan x="80" dy="44" fill="#0284C7">20 amp circuit?</tspan>
  </text>
  <text x="80" y="330" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">The real NEC answer</text>
  <rect x="80" y="354" width="56" height="4" rx="2" fill="url(#otAccentBar)"/>

  <!-- Branch circuit run with receptacles -->
  <path d="M524 200 L 900 200" stroke="#0284C7" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <g>
    <rect x="524" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="1.8"/>
    <circle cx="547" cy="186" r="3.4" fill="#94A3B8"/><circle cx="547" cy="196" r="3.4" fill="#94A3B8"/>
    <rect x="541" y="208" width="12" height="4" rx="2" fill="#94A3B8"/>

    <rect x="590" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="1.8"/>
    <circle cx="613" cy="186" r="3.4" fill="#94A3B8"/><circle cx="613" cy="196" r="3.4" fill="#94A3B8"/>
    <rect x="607" y="208" width="12" height="4" rx="2" fill="#94A3B8"/>

    <rect x="656" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="1.8"/>
    <circle cx="679" cy="186" r="3.4" fill="#94A3B8"/><circle cx="679" cy="196" r="3.4" fill="#94A3B8"/>
    <rect x="673" y="208" width="12" height="4" rx="2" fill="#94A3B8"/>

    <rect x="722" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="1.8"/>
    <circle cx="745" cy="186" r="3.4" fill="#94A3B8"/><circle cx="745" cy="196" r="3.4" fill="#94A3B8"/>
    <rect x="739" y="208" width="12" height="4" rx="2" fill="#94A3B8"/>

    <rect x="788" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#7DD3FC" stroke-width="1.8"/>
    <circle cx="811" cy="186" r="3.4" fill="#94A3B8"/><circle cx="811" cy="196" r="3.4" fill="#94A3B8"/>
    <rect x="805" y="208" width="12" height="4" rx="2" fill="#94A3B8"/>

    <rect x="854" y="164" width="46" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.6" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="877" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">…</text>
  </g>

  <!-- Two answers -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="276" width="182" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#01AD9F" stroke-width="2.2"/>
    <text x="542" y="302" fill="#0F766E" font-size="18" font-weight="800">No limit</text>
    <text x="542" y="324" fill="#64748B" font-size="10.5" font-weight="500">in a dwelling · 220.14(J)</text>

    <rect x="718" y="276" width="182" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#93C5FD" stroke-width="2"/>
    <text x="736" y="302" fill="#2563EB" font-size="18" font-weight="800">13 outlets</text>
    <text x="736" y="324" fill="#64748B" font-size="10.5" font-weight="500">commercial · 220.14(I)</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
