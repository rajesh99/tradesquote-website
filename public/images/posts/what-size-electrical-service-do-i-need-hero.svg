<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ssHeroTitle ssHeroDesc">
  <title id="ssHeroTitle">What size electrical service do I need</title>
  <desc id="ssHeroDesc">Abstract hero graphic with soft gradients showing a ladder of standard service ratings from 100 to 400 amps with the 200 amp rating highlighted.</desc>

  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ssSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ssTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ssBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="ssBarHot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ssAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ssBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ssBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#ssSky)" filter="url(#ssBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#ssTeal)" filter="url(#ssBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="176" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">What size</tspan>
    <tspan x="80" dy="42">electrical service</tspan>
    <tspan x="80" dy="42" fill="#0284C7">do I need?</tspan>
  </text>
  <text x="80" y="322" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">100 A to 400 A</text>
  <rect x="80" y="346" width="56" height="4" rx="2" fill="url(#ssAccentBar)"/>

  <!-- Ratings ladder -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="524" y="140" fill="#94A3B8" font-size="11" font-weight="700">100 A</text>
    <rect x="586" y="126" width="80" height="20" rx="6" fill="url(#ssBar)"/>
    <text x="678" y="141" fill="#64748B" font-size="10.5">24 kVA</text>

    <text x="524" y="178" fill="#94A3B8" font-size="11" font-weight="700">125 A</text>
    <rect x="586" y="164" width="100" height="20" rx="6" fill="url(#ssBar)"/>
    <text x="698" y="179" fill="#64748B" font-size="10.5">30 kVA</text>

    <text x="524" y="216" fill="#94A3B8" font-size="11" font-weight="700">150 A</text>
    <rect x="586" y="202" width="120" height="20" rx="6" fill="url(#ssBar)"/>
    <text x="718" y="217" fill="#64748B" font-size="10.5">36 kVA</text>

    <text x="524" y="256" fill="#0F766E" font-size="13" font-weight="800">200 A</text>
    <rect x="586" y="240" width="160" height="24" rx="7" fill="url(#ssBarHot)" stroke="#01AD9F" stroke-width="1.8"/>
    <text x="758" y="257" fill="#0F766E" font-size="11.5" font-weight="700">48 kVA</text>

    <text x="524" y="296" fill="#94A3B8" font-size="11" font-weight="700">320 A</text>
    <rect x="586" y="282" width="256" height="20" rx="6" fill="url(#ssBar)"/>
    <text x="854" y="297" fill="#64748B" font-size="10.5">77 kVA</text>

    <text x="524" y="334" fill="#94A3B8" font-size="11" font-weight="700">400 A</text>
    <rect x="586" y="320" width="300" height="20" rx="6" fill="url(#ssBar)"/>
    <text x="586" y="366" fill="#94A3B8" font-size="11" font-weight="600">a load calculation picks the row</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
