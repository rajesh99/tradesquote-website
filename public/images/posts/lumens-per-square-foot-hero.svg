<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="lsHeroTitle lsHeroDesc">
  <title id="lsHeroTitle">Lumens per square foot</title>
  <desc id="lsHeroDesc">Abstract hero graphic with soft gradients showing that a footcandle is defined as one lumen per square foot, so the two are the same quantity and there is nothing to convert between them.</desc>

  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="lsAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lsTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lsAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="lsBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#lsBg)"/>
  <ellipse cx="810" cy="134" rx="200" ry="160" fill="url(#lsAmber)" filter="url(#lsBlur)"/>
  <ellipse cx="648" cy="394" rx="180" ry="140" fill="url(#lsTeal)" filter="url(#lsBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="160" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Lumens per</tspan>
    <tspan x="80" dy="42" fill="#D97706">square foot</tspan>
  </text>
  <text x="80" y="272" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Footcandle targets, room by room</text>
  <rect x="80" y="296" width="56" height="4" rx="2" fill="url(#lsAccentBar)"/>
  <text x="80" y="344" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">area &#215; footcandles &#247; lumens per fixture</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="118" fill="#94A3B8" font-size="11" font-weight="700">THE CONVERSION EVERYONE LOOKS FOR</text>
    <rect x="530" y="130" width="356" height="46" rx="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="550" y="159" fill="#334155" font-size="14" font-weight="700">footcandles &#8594; lumens per ft&#178;</text>

    <text x="530" y="208" fill="#94A3B8" font-size="11" font-weight="700">DOES NOT EXIST</text>
    <rect x="530" y="220" width="356" height="46" rx="9" fill="#FFF7ED" stroke="#D97706" stroke-width="2.4"/>
    <text x="550" y="249" fill="#B45309" font-size="14" font-weight="700">They are the same unit. 1 fc = 1 lm/ft&#178;.</text>

    <rect x="530" y="288" width="356" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="316" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="800">10 fc hall &#8594; 50 fc workshop</text>
    <text x="708" y="340" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">a fivefold spread, so one whole-house number is useless</text>

    <text x="530" y="390" fill="#94A3B8" font-size="11" font-weight="600">and in most rooms the spacing grid governs anyway</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
