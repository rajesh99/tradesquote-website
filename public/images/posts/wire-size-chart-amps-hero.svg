<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="wcHeroTitle wcHeroDesc">
  <title id="wcHeroTitle">Wire size chart, amps to AWG</title>
  <desc id="wcHeroDesc">Abstract hero graphic with soft gradients showing a tabular chart of conductor sizes against ampacity for copper and aluminum.</desc>

  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="wcSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wcTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wcRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wcAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="wcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#wcBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#wcSky)" filter="url(#wcBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#wcTeal)" filter="url(#wcBlur)"/>

  <rect x="48" y="72" width="400" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="196" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Wire size chart</tspan>
    <tspan x="80" dy="50" fill="#0284C7">amps to AWG</tspan>
  </text>
  <text x="80" y="298" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Copper and aluminum, side by side</text>
  <rect x="80" y="322" width="56" height="4" rx="2" fill="url(#wcAccentBar)"/>

  <!-- Chart panel -->
  <g>
    <rect x="520" y="120" width="380" height="260" rx="16" fill="#FFFFFF" fill-opacity="0.72" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="546" y="152" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">AWG</text>
    <text x="646" y="152" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">CU</text>
    <text x="746" y="152" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">AL</text>
    <line x1="546" y1="164" x2="874" y2="164" stroke="#7DD3FC" stroke-width="1.5"/>

    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      <rect x="536" y="176" width="348" height="30" rx="6" fill="url(#wcRow)" opacity="0.35"/>
      <text x="546" y="196" fill="#152035">12</text><text x="646" y="196" fill="#0F766E">25 A</text><text x="746" y="196" fill="#64748B">20 A</text>
      <rect x="536" y="212" width="348" height="30" rx="6" fill="url(#wcRow)" opacity="0.5"/>
      <text x="546" y="232" fill="#152035">10</text><text x="646" y="232" fill="#0F766E">35 A</text><text x="746" y="232" fill="#64748B">30 A</text>
      <rect x="536" y="248" width="348" height="30" rx="6" fill="url(#wcRow)" opacity="0.65"/>
      <text x="546" y="268" fill="#152035">8</text><text x="646" y="268" fill="#0F766E">50 A</text><text x="746" y="268" fill="#64748B">40 A</text>
      <rect x="536" y="284" width="348" height="30" rx="6" fill="url(#wcRow)" opacity="0.8"/>
      <text x="546" y="304" fill="#152035">6</text><text x="646" y="304" fill="#0F766E">65 A</text><text x="746" y="304" fill="#64748B">50 A</text>
      <rect x="536" y="320" width="348" height="30" rx="6" fill="url(#wcRow)" opacity="0.95"/>
      <text x="546" y="340" fill="#152035">4</text><text x="646" y="340" fill="#0F766E">85 A</text><text x="746" y="340" fill="#64748B">65 A</text>
    </g>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
