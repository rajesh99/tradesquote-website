<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="ocHeroTitle ocHeroDesc">
  <title id="ocHeroTitle">Cost to install an outlet</title>
  <desc id="ocHeroDesc">Abstract hero graphic with soft gradients showing that adding a receptacle to an existing circuit costs about 242 dollars while a new dedicated circuit in finished walls costs about 981 dollars, and that labour is 90 percent of it.</desc>

  <defs>
    <linearGradient id="ocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="ocSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ocTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ocAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ocBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#ocBg)"/>
  <ellipse cx="800" cy="136" rx="200" ry="160" fill="url(#ocSky)" filter="url(#ocBlur)"/>
  <ellipse cx="652" cy="392" rx="180" ry="140" fill="url(#ocTeal)" filter="url(#ocBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Cost to add</tspan>
    <tspan x="80" dy="40" fill="#0284C7">an outlet</tspan>
  </text>
  <text x="80" y="274" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">You're buying access, not a device</text>
  <rect x="80" y="298" width="56" height="4" rx="2" fill="url(#ocAccentBar)"/>
  <text x="80" y="346" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">$95/h · 15% overhead · 25% margin</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="122" fill="#94A3B8" font-size="11" font-weight="700">ONTO AN EXISTING CIRCUIT, OPEN ACCESS</text>
    <rect x="530" y="134" width="356" height="48" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.4"/>
    <text x="550" y="164" fill="#15803D" font-size="19" font-weight="800">$242</text>
    <text x="640" y="164" fill="#94A3B8" font-size="12" font-weight="600">1.5 h and a $15 device</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">NEW DEDICATED CIRCUIT, FINISHED WALLS</text>
    <rect x="530" y="224" width="356" height="48" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="550" y="254" fill="#B91C1C" font-size="19" font-weight="800">$981</text>
    <text x="640" y="254" fill="#94A3B8" font-size="12" font-weight="600">6 h and a $70 material list</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="19" font-weight="800">labour is 90% of it</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">the receptacle itself is under $6</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">4× spread on the same finished outlet</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
