<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="rsHeroTitle rsHeroDesc">
  <title id="rsHeroTitle">Receptacle spacing under NEC 210.52</title>
  <desc id="rsHeroDesc">Abstract hero graphic with soft gradients showing that the 6-foot rule is about cord reach, which produces 12-foot spacing along a wall as a consequence.</desc>

  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="rsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rsTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rsAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="rsBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#rsBg)"/>
  <ellipse cx="800" cy="134" rx="200" ry="160" fill="url(#rsSky)" filter="url(#rsBlur)"/>
  <ellipse cx="654" cy="394" rx="180" ry="140" fill="url(#rsTeal)" filter="url(#rsBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="162" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Receptacle</tspan>
    <tspan x="80" dy="42" fill="#0284C7">spacing</tspan>
  </text>
  <text x="80" y="278" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">It's a rule about cord length</text>
  <rect x="80" y="302" width="56" height="4" rx="2" fill="url(#rsAccentBar)"/>
  <text x="80" y="350" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">NEC 210.52 · the 6-foot rule</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="530" y="124" fill="#94A3B8" font-size="11" font-weight="700">THE RULE</text>
    <rect x="530" y="136" width="356" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="550" y="165" fill="#2563EB" font-size="13.5" font-weight="700">no point more than 6 ft from an outlet</text>

    <text x="530" y="212" fill="#94A3B8" font-size="11" font-weight="700">THE CONSEQUENCE</text>
    <rect x="530" y="224" width="356" height="46" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="253" fill="#15803D" font-size="13.5" font-weight="700">receptacles at most 12 ft apart</text>

    <rect x="530" y="292" width="356" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="708" y="320" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="800">so a 6 ft cord always reaches</text>
    <text x="708" y="342" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">12 ft is derived, not the requirement</text>

    <text x="530" y="388" fill="#94A3B8" font-size="11" font-weight="600">countertops use 24 in, not 6 ft</text>
  </g>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
