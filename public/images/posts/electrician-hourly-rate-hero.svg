<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="erHeroTitle erHeroDesc">
  <title id="erHeroTitle">Electrician hourly rate</title>
  <desc id="erHeroDesc">Abstract hero graphic with soft gradients showing an hourly wage expanding through burden, overhead and margin into a billing rate.</desc>

  <defs>
    <linearGradient id="erBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="erSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="erTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="erGrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#01AD9F" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="erAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01AD9F"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="erBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#erBg)"/>
  <ellipse cx="790" cy="130" rx="200" ry="160" fill="url(#erSky)" filter="url(#erBlur)"/>
  <ellipse cx="670" cy="390" rx="180" ry="140" fill="url(#erTeal)" filter="url(#erBlur)"/>

  <rect x="48" y="72" width="410" height="356" rx="24" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="80" y="184" fill="#152035" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="80" dy="0">Electrician</tspan>
    <tspan x="80" dy="44" fill="#0284C7">hourly rate</tspan>
  </text>
  <text x="80" y="290" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Apprentice, journeyman, master</text>
  <rect x="80" y="314" width="56" height="4" rx="2" fill="url(#erAccentBar)"/>

  <!-- Wage expanding into rate -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="524" y="150" width="90" height="34" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="569" y="173" text-anchor="middle" fill="#2563EB" font-size="14" font-weight="800">$32</text>
    <text x="569" y="200" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="600">wage</text>

    <path d="M614 167 L 660 167" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <rect x="660" y="140" width="230" height="54" rx="10" fill="url(#erGrow)" opacity="0.22"/>
    <text x="775" y="163" text-anchor="middle" fill="#0F766E" font-size="10.5" font-weight="700">+ burden + overhead</text>
    <text x="775" y="181" text-anchor="middle" fill="#0F766E" font-size="10.5" font-weight="700">÷ billable hours + margin</text>

    <rect x="660" y="216" width="230" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#01AD9F" stroke-width="2.6"/>
    <text x="775" y="245" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">$105.62</text>
    <text x="775" y="265" text-anchor="middle" fill="#64748B" font-size="10" font-weight="500">what you must bill</text>

    <rect x="660" y="292" width="230" height="30" rx="15" fill="#F0FDFA" fill-opacity="0.9" stroke="#5EEAD4" stroke-width="1.6"/>
    <text x="775" y="312" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="800">3.30× the wage</text>
  </g>

  <!-- Billable note -->
  <text x="524" y="366" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">only 1,560 of 2,080 paid hours are billable</text>

  <rect x="0" y="496" width="1000" height="4" fill="#01AD9F"/>
</svg>
